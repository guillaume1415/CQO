    '<div class="card"><div class="eyebrow">'+esc(t.name)+' — Résultat</div>'
    +'<div class="score-ring">'
    +'<div class="ring"><svg width="88" height="88"><circle cx="44" cy="44" r="36" fill="none" stroke="var(--line)" stroke-width="8"/>'
    +'<circle cx="44" cy="44" r="36" fill="none" stroke="'+(pass?'var(--good)':'var(--bad)')+'" stroke-width="8" stroke-dasharray="'+C+'" stroke-dashoffset="'+Math.round(C*(1-pct/100))+'" stroke-linecap="round"/>'
    +'</svg><div class="ring-label"><div class="ring-pct">'+pct+'%</div></div></div>'
    +'<div><div style="font-size:1.5rem;font-weight:800">'+X.score+' / '+N+'</div>'
    +'<div class="verdict-big '+(pass?'ok':'ko')+'">'+(pass?'Admis':'Non admis')+' <span class="muted small">(seuil '+X.seuil+' %)</span></div>'
    +'<div class="muted">'+Math.floor(secs/60)+' min '+secs%60+' s'+(X.timeout?' · temps écoulé':'')+'</div></div>'
    +'</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +'<button class="btn btn-primary" onclick="startExam(\''+X.id+'\')">Refaire le test</button>'
    +'<button class="btn btn-secondary" onclick="S.exam=null;render()">Retour aux tests</button>'
    +(X.score<N?'<button class="btn btn-secondary" onclick="S.exam=null;S.tab=\'erreurs\';render()">Voir mes erreurs</button>':'')
    +'</div></div>'
    +'<div class="card" style="margin-top:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    +'<div class="eyebrow" style="margin:0">Correction</div><div class="nq-row" style="margin:0">'
    +'<button class="nq-btn'+(S.examFilter!=='ko'?' active':'')+'" onclick="S.examFilter=\'all\';renderExamResult()">Toutes ('+N+')</button>'
    +'<button class="nq-btn'+(S.examFilter==='ko'?' active':'')+'" onclick="S.examFilter=\'ko\';renderExamResult()">Erreurs ('+(N-X.score)+')</button>'
    +'</div></div>'+(items||'<p class="muted" style="margin-top:10px">Aucune erreur. Bravo !</p>')+'</div>';
}

/* MES ERREURS */
var ERR_SHOWN=[];
function renderErreurs(){
  var e=getErrs();
  var keys=Object.keys(e).filter(findQ);
  if(!keys.length){
    el('app').innerHTML='<div class="card"><div class="eyebrow">Mes erreurs</div>'
      +'<div class="empty" style="padding:28px 12px"><div class="emo">&#127919;</div>'
      +'<p>Aucune erreur enregistrée pour l’instant.</p>'
      +'<p class="muted small" style="margin-top:6px">Les questions ratées pendant vos QCM apparaîtront ici, pour les revoir et vous entraîner dessus.</p>'
      +'<button class="btn btn-primary" style="margin-top:16px" onclick="S.tab=\'cqo\';render()">Faire un QCM</button></div></div>';
    return;
  }
  var todo=keys.filter(function(k){return !e[k].ok;}).length;
  var mats={};keys.forEach(function(k){if(S.errAll||!e[k].ok){var m=errMatOf(k);mats[m]=(mats[m]||0)+1;}});
  if(S.errMat!=='__all__'&&!mats[S.errMat])S.errMat='__all__';
  var shown=errKeys().sort(function(a,b){return (e[a].ok-e[b].ok)||(e[b].n-e[a].n)||(e[b].last-e[a].last);});
  ERR_SHOWN=shown;
  var matOpts='<option value="__all__">Toutes les matières ('+Object.values(mats).reduce(function(a,b){return a+b;},0)+')</option>'
    +Object.keys(mats).map(function(m){
      return '<option value="'+esc(m)+'"'+(S.errMat===m?' selected':'')+'>'+esc(matLabel(m))+' ('+mats[m]+')</option>';
    }).join('');
  var nq=Math.min(S.nq,shown.length);
  var nqOpts=[10,20,40,'Tout'].map(function(v){
    var val=v==='Tout'?99999:v;
    return '<button class="nq-btn'+(S.nq===val?' active':'')+'" onclick="S.nq='+val+';renderErreurs()">'+v+'</button>';
  }).join('');
  var list=shown.map(function(k,i){
    var q=findQ(k),r=e[k];
    var good=q.opts.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(' / ');
    var d=new Date(r.last).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    return '<div class="qa-item"><div class="qa-num">'+(i+1)+'</div><div class="qa-text">'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">'
      +'<span class="err-tag '+(r.ok?'err-ok':'err-ko')+'">'+(r.ok?'Corrigée':'À revoir')+'</span>'
      +'<span class="err-tag">Ratée '+r.n+' fois · '+d+'</span>'
      +'<span class="err-tag">'+esc(matLabel(errMatOf(k)))+'</span></div>'
      +'<div style="font-weight:600;margin-bottom:4px">'+esc(q.q)+'</div>'
      +'<div style="color:var(--good);font-size:.84rem">✓ '+esc(good)+'</div>'
      +(q.e?'<div class="expl" style="margin-top:6px">'+esc(q.e)+'</div>':'')
      +'</div><div class="qa-acts"><button class="btn btn-secondary btn-sm" title="Retirer de la liste" onclick="delErr('+i+')">✕</button></div></div>';
  }).join('');
  el('app').innerHTML=
    '<div class="card">'
    +'<div class="eyebrow">Mes erreurs</div>'
    +'<h2 style="font-size:1.25rem;margin-bottom:4px">'+todo+' question'+(todo>1?'s':'')+' à revoir</h2>'
    +'<p class="muted small">'+(keys.length-todo)+' corrigée'+(keys.length-todo>1?'s':'')+' · une question passe en « Corrigée » dès que vous y répondez juste.</p>'
    +'<div class="field"><label class="lbl">Matière</label>'
    +'<select onchange="S.errMat=this.value;renderErreurs()">'+matOpts+'</select></div>'
    +'<div class="nq-row">'
    +'<button class="nq-btn'+(!S.errAll?' active':'')+'" onclick="S.errAll=false;renderErreurs()">À revoir ('+todo+')</button>'
    +'<button class="nq-btn'+(S.errAll?' active':'')+'" onclick="S.errAll=true;renderErreurs()">Toutes ('+keys.length+')</button>'
    +'</div>'
    +'<div class="eyebrow" style="margin-top:6px">Nombre de questions</div>'
    +'<div class="nq-row">'+nqOpts+'</div>'
    +'<button class="btn btn-primary btn-block" onclick="startErrQuiz()"'+(shown.length?'':' disabled')+'>'
    +'Tester mes erreurs ('+nq+' q)</button>'
    +'</div>'
    +(shown.length
      ?'<div class="card" style="margin-top:12px"><div class="eyebrow">Liste ('+shown.length+')</div>'+list+'</div>'
      :'<div class="card" style="margin-top:12px"><p class="muted">Aucune erreur à revoir dans cette sélection. Bravo !</p></div>')
    +'<div style="margin-top:12px;text-align:right">'
    +'<button class="btn btn-secondary btn-sm" onclick="clearErrs()">Effacer toute la liste</button></div>';
}
function startErrQuiz(){S.matId='__errors__';startQuiz();}
function delErr(i){var e=getErrs();delete e[ERR_SHOWN[i]];setErrs(e);render();}
function clearErrs(){
  if(!confirm('Effacer toute la liste de vos erreurs ?'))return;
  try{localStorage.removeItem(KEY.errs);}catch(e){}
  render();
}

/* REVISIONS */
function renderRevisions(){
  var pool=getQuestions(S.revMat);
  if(!pool.length){el('app').innerHTML='<div class="card"><p class="muted">Aucune question dans cette matière.</p></div>';return;}
  if(S.revIdx>=pool.length)S.revIdx=0;
  var q=pool[S.revIdx];
  var rightAnswers=q.opts.filter(function(o){return o.c;}).map(function(o){return o.t;});
  var totalAll=Object.values(MATIERES).reduce(function(s,m){return s+m.qs.length;},0);
  var matOpts='<option value="__all__"'+(S.revMat==='__all__'?' selected':'')+'>Toutes ('+totalAll+')</option>'
    +Object.entries(MATIERES).map(function(e){
      return '<option value="'+esc(e[0])+'"'+(S.revMat===e[0]?' selected':'')+'>'+esc(e[1].name)+' ('+e[1].qs.length+')</option>';
    }).join('');
  el('app').innerHTML=
    '<div class="card">'
    +'<div class="eyebrow">Révisions — Flashcards</div>'
    +'<div class="field"><label class="lbl">Matière</label>'
    +'<select onchange="S.revMat=this.value;S.revIdx=0;S.revFlipped=false;renderRevisions()">'+matOpts+'</select></div>'
    +'</div>'
    +'<div class="flashcard" style="margin-top:12px" onclick="S.revFlipped=!S.revFlipped;renderRevisions()">'
    +'<div class="eyebrow" style="text-align:left">Question '+(S.revIdx+1)+' / '+pool.length+'</div>'
    +'<p class="fc-q" style="margin-top:8px">'+esc(q.q)+'</p>'
    +(S.revFlipped?
      '<div class="fc-sep"></div>'
      +'<div class="fc-a">'+rightAnswers.map(esc).join('<br>')+'</div>'
      +(q.e?'<div class="expl" style="margin-top:12px;text-align:left">'+esc(q.e)+'</div>':'')
      :'<p class="muted" style="margin-top:16px;font-size:.85rem">Cliquer pour voir la réponse</p>')
    +'</div>'
    +'<div style="display:flex;gap:10px;margin-top:12px;justify-content:center">'
    +'<button class="btn btn-secondary" onclick="S.revIdx=Math.max(0,S.revIdx-1);S.revFlipped=false;renderRevisions()">← Préc.</button>'
    +'<button class="btn btn-secondary" onclick="S.revIdx=Math.floor(Math.random()*'+pool.length+');S.revFlipped=false;renderRevisions()">Au hasard</button>'
    +'<button class="btn btn-secondary" onclick="S.revIdx=Math.min('+(pool.length-1)+',S.revIdx+1);S.revFlipped=false;renderRevisions()">Suiv. →</button>'
    +'</div>';
}

function renderAcroList(){
  var q=acroSearch.toLowerCase();
  var list=getAcro().filter(function(a){
    return !q||a.a.toLowerCase().includes(q)||a.d.toLowerCase().includes(q);
  });
  el('acroList').innerHTML=list.length===0
      ?'<div class="empty"><div class="emo">&#128219;</div><p>Aucun acronyme trouvé.</p></div>'
      :'<div class="card" style="margin-top:10px">'
      +'<p class="muted small" style="margin-bottom:4px">'+list.length+' acronyme'+(list.length>1?'s':'')+'</p>'
      +list.map(function(a){
        return '<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">'
          +'<div style="font-weight:800;min-width:80px;color:var(--gold)">'+esc(a.a)+'</div>'
          +'<div>'+esc(a.d)+(a.c?'<span class="muted" style="margin-left:6px">· '+esc(a.c)+'</span>':'')+'</div>'
          +'</div>';
      }).join('')
      +'</div>';
}

/* DATES */
function renderDates(){
  var list=getDates();
  el('app').innerHTML=
    '<div class="card">'
    +'<div class="eyebrow">Dates clés</div>'
    +'</div>'
    +(list.length===0
      ?'<div class="empty"><div class="emo">&#128197;</div><p>Aucune date enregistrée. Ajoutez-en dans Réglages.</p></div>'
      :'<div class="card" style="margin-top:10px">'
      +list.map(function(d){
        return '<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">'
          +'<div style="font-weight:800;min-width:80px;color:var(--gold)">'+esc(d.y)+'</div>'
          +'<div>'+esc(d.e)+'</div>'
          +'</div>';
      }).join('')
      +'</div>');
}

/* HISTORIQUE */
function renderHistoire(){
  var hist=getHist();
  if(!hist.length){
    el('app').innerHTML='<div class="empty"><div class="emo">&#128202;</div><p>Aucune session enregistrée pour l’instant.</p></div>';
    return;
  }
  var last20=hist.slice(0,20).reverse();
  var canvasId='chartCV';
  var rows=hist.slice(0,50).map(function(h,i){
    var pct=Math.round(h.score/h.total*100);
    var d=new Date(h.date);var ds=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
    var matName=h.mat==='__all__'?'Toutes':matLabel(h.mat);
    return '<tr style="border-bottom:1px solid var(--line)">'
      +'<td style="padding:7px 4px;color:var(--ink-soft);font-size:.8rem">'+ds+'</td>'
      +'<td style="padding:7px 4px;font-size:.82rem">'+esc(matName)+'</td>'
      +'<td style="padding:7px 4px;font-weight:700">'+h.score+'/'+h.total+'</td>'
      +'<td style="padding:7px 4px"><span style="color:'+(pct>=60?'var(--good)':'var(--bad)')+'">'+pct+'%</span></td>'
      +'</tr>';
  }).join('');
  el('app').innerHTML=
    '<div class="card"><div class="eyebrow">Historique</div>'
    +'<canvas id="'+canvasId+'"></canvas>'
    +'</div>'
    +'<div class="card" style="margin-top:10px">'
    +'<table style="width:100%;border-collapse:collapse"><thead>'
    +'<tr style="border-bottom:2px solid var(--line)"><th style="text-align:left;padding:4px;font-size:.8rem;color:var(--ink-soft)">Date</th>'
    +'<th style="text-align:left;padding:4px;font-size:.8rem;color:var(--ink-soft)">Matière</th>'
    +'<th style="text-align:left;padding:4px;font-size:.8rem;color:var(--ink-soft)">Score</th>'
    +'<th style="text-align:left;padding:4px;font-size:.8rem;color:var(--ink-soft)">%</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table>'
    +'</div>'
    +'<div style="margin-top:12px;text-align:right">'
    +'<button class="btn btn-secondary btn-sm" onclick="clearHist()">Effacer l’historique</button>'
    +'</div>';
  setTimeout(function(){
    var c=el(canvasId);if(!c)return;
    var dpr=window.devicePixelRatio||1;
    var w=c.offsetWidth;var h=140;
    c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';
    var ctx=c.getContext('2d');ctx.scale(dpr,dpr);
    var pts=last20.map(function(r){return Math.round(r.score/r.total*100);});
    var cs=getComputedStyle(document.documentElement);
    var gold=cs.getPropertyValue('--gold').trim()||'#b08628';
    var ink=cs.getPropertyValue('--ink-soft').trim()||'#5a6273';
    var line=cs.getPropertyValue('--line').trim()||'#e0d9c8';
    var pad={t:12,r:8,b:28,l:36};
    var fw=w-pad.l-pad.r;var fh=h-pad.t-pad.b;
    ctx.strokeStyle=line;ctx.lineWidth=1;
    [0,25,50,75,100].forEach(function(v){
      var y=pad.t+fh*(1-v/100);
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+fw,y);ctx.stroke();
      ctx.fillStyle=ink;ctx.font='10px sans-serif';ctx.textAlign='right';
      ctx.fillText(v+'%',pad.l-4,y+3);
    });
    if(pts.length<2){return;}
    var xStep=fw/(pts.length-1);
    ctx.strokeStyle=gold;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
    pts.forEach(function(p,i){
      var x=pad.l+i*xStep;var y=pad.t+fh*(1-p/100);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.fillStyle=gold;
    pts.forEach(function(p,i){
      ctx.beginPath();ctx.arc(pad.l+i*xStep,pad.t+fh*(1-p/100),3.5,0,2*Math.PI);ctx.fill();
    });
  },50);
}

function clearHist(){
  if(confirm('Effacer tout l’historique ?')){
    localStorage.removeItem(KEY.hist);renderHistoire();
  }
}

/* REGLAGES */
var adminMsg='';
function renderReglages(){
  var matOpts='<option value="">-- Sélectionner --</option>'
    +Object.entries(MATIERES).map(function(e){
      return '<option value="'+esc(e[0])+'"'+(S.editMat===e[0]?' selected':'')+'>'+esc(e[1].name)+' ('+e[1].qs.length+')</option>';
    }).join('');
  var qs=S.editMat?(MATIERES[S.editMat]||{qs:[]}).qs:[];
  var qList=qs.map(function(q,i){
    return '<div class="qa-item"><div class="qa-num">'+(i+1)+'.</div>'
      +'<div class="qa-text">'+esc(q.q.substring(0,100))+(q.q.length>100?'…':'')+(isMulti(q)?' <span class="muted small">(multi)</span>':'')+'</div>'
      +'<div class="qa-acts">'
      +'<button class="btn btn-secondary btn-sm" onclick="editQ('+i+')">✎</button>'
      +'<button class="btn btn-danger btn-sm" onclick="delQ('+i+')">✕</button>'
      +'</div></div>';
  }).join('');
  var hasEdits=Object.keys(getEdits()).length>0;
  el('app').innerHTML=
    (adminMsg?'<div class="flash '+(adminMsg.ok?'flash-ok':'flash-err')+'">'+esc(adminMsg.txt)+'</div>':'')
    +'<div class="card">'
    +'<div class="eyebrow">Réglages</div>'
    +'<h2 style="font-size:1.2rem;margin-bottom:4px">Préférences du QCM</h2>'
    +'<div class="field"><label class="lbl">Chronomètre</label>'
    +'<div class="nq-row" style="margin-top:4px">'+timerBtns()+'</div>'
    +'<p class="muted small">1 minute par question. À zéro, la question est comptée fausse et la correction s’affiche.</p></div>'
    +'</div>'
    +'<div class="card" style="margin-top:10px">'
    +'<div class="eyebrow">Questions</div>'
    +'<div class="field"><label class="lbl">Matière</label>'
    +'<select onchange="S.editMat=this.value;S.editIdx=-1;adminMsg=\'\';renderReglages()">'+matOpts+'</select></div>'
    +(S.editMat?
      '<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="S.editIdx=-2;adminMsg=\'\';renderReglages()">+ Ajouter une question</button>'
      +'<div style="margin-top:10px">'+qList+'</div>'
    :'')
    +'<p class="muted small" style="margin-top:10px">Les ajouts et modifications sont enregistrés dans ce navigateur.</p>'
    +'</div>'
    +(S.editIdx===-2||S.editIdx>=0?renderQForm(S.editMat,S.editIdx>=0?qs[S.editIdx]:null):'')
    +'<div class="card" style="margin-top:10px">'
    +'<div class="eyebrow">Acronymes</div>'
    +'<button class="btn btn-primary btn-sm" onclick="addAcro()">+ Ajouter un acronyme</button>'
    +'</div>'
    +'<div class="card" style="margin-top:10px">'
    +'<div class="eyebrow">Dates clés</div>'
    +'<button class="btn btn-primary btn-sm" onclick="addDate()">+ Ajouter une date</button>'
    +'</div>'
    +(hasEdits?'<div class="card" style="margin-top:10px">'
      +'<div class="eyebrow">Données</div>'
      +'<button class="btn btn-secondary btn-sm" onclick="resetEdits()">Revenir aux questions d’origine</button>'
      +'</div>':'');
  adminMsg='';
}
function resetEdits(){
  if(!confirm('Revenir aux questions d’origine ? Vos ajouts et modifications de questions seront perdus.'))return;
  try{localStorage.removeItem(KEY.qedits);}catch(e){}
  location.reload();
}

function renderQForm(mat,q){
  var opts=q?q.opts:[{t:'',c:true},{t:'',c:false},{t:'',c:false},{t:'',c:false}];
  var optRows=opts.map(function(o,i){
    return '<div class="opt-row"><input type="checkbox" id="oc'+i+'"'+(o.c?' checked':'')+' title="Bonne réponse">'
      +'<input type="text" id="ot'+i+'" value="'+esc(o.t)+'" placeholder="Option '+(i+1)+'"></div>';
  }).join('');
  return '<div class="card" style="margin-top:10px">'
    +'<div class="eyebrow">'+(q?'Modifier la question':'Nouvelle question')+'</div>'
    +'<div class="field"><label class="lbl">Énoncé</label>'
    +'<textarea id="qText" rows="3">'+esc(q?q.q:'')+'</textarea></div>'
    +'<div class="field"><label class="lbl">Options (cochez les bonnes réponses)</label>'
    +optRows
    +'<button class="btn btn-secondary btn-sm" onclick="addOptRow()">+ Option</button></div>'
    +'<div class="field"><label class="lbl">Explication (optionnelle)</label>'
    +'<textarea id="qExpl" rows="2">'+esc(q?q.e:'')+'</textarea></div>'
    +'<div style="display:flex;gap:8px;margin-top:14px">'
    +'<button class="btn btn-primary" onclick="saveQ(\''+esc(mat)+'\')">Enregistrer</button>'
    +'<button class="btn btn-secondary" onclick="S.editIdx=-1;renderReglages()">Annuler</button>'
    +'</div></div>';
}

function addOptRow(){
  var i=document.querySelectorAll('.opt-row').length;
  var row=document.createElement('div');row.className='opt-row';
  row.innerHTML='<input type="checkbox" id="oc'+i+'"><input type="text" id="ot'+i+'" placeholder="Option '+(i+1)+'">';
  document.querySelector('.field .btn-secondary').before(row);
}

function saveQ(mat){
  if(!mat){adminMsg={ok:false,txt:'Sélectionne une matière.'};renderReglages();return;}
  var qt=(el('qText').value||'').trim();
  if(!qt){adminMsg={ok:false,txt:'L’énoncé est vide.'};renderReglages();return;}
  var opts=[];var i=0;
  while(el('oc'+i)){
    var t=(el('ot'+i).value||'').trim();
    if(t)opts.push({t:t,c:el('oc'+i).checked});
    i++;
  }
  if(opts.length<2){adminMsg={ok:false,txt:'Il faut au moins 2 options.'};renderReglages();return;}
  if(!opts.some(function(o){return o.c;})){adminMsg={ok:false,txt:'Coche au moins une bonne réponse.'};renderReglages();return;}
  var multi=opts.filter(function(o){return o.c;}).length>1;
  var item={q:qt,opts:opts,e:(el('qExpl').value||'').trim(),multi:multi,_m:mat};
  if(!MATIERES[mat])MATIERES[mat]={name:mat,qs:[]};
  if(S.editIdx>=0)MATIERES[mat].qs[S.editIdx]=item;
  else MATIERES[mat].qs.push(item);
  saveMatEdits(mat);S.editIdx=-1;adminMsg={ok:true,txt:'Question enregistrée.'};renderReglages();
}

function editQ(i){S.editIdx=i;renderReglages();}
function delQ(i){
  if(!confirm('Supprimer cette question ?'))return;
  MATIERES[S.editMat].qs.splice(i,1);
  saveMatEdits(S.editMat);adminMsg={ok:true,txt:'Question supprimée.'};renderReglages();
}

function addAcro(){
  var a=prompt('Acronyme (ex: CEMA):');if(!a)return;
  var d=prompt('Définition:');if(!d)return;
  var c=prompt('Voir aussi (optionnel):');
  var list=getAcro();list.push({a:a.toUpperCase().trim(),d:d.trim(),c:c||''});
  list.sort(function(x,y){return x.a.localeCompare(y.a,'fr');});
  setAcro(list);adminMsg={ok:true,txt:'Acronyme ajouté.'};renderReglages();
}

function addDate(){
  var y=prompt('Année / Date (ex: 1933):');if(!y)return;
  var e=prompt('Événement:');if(!e)return;
  var list=getDates();list.push({y:y.trim(),e:e.trim()});
  list.sort(function(x,y){return x.y.localeCompare(y.y,'fr',{numeric:true});});
  setDates(list);adminMsg={ok:true,txt:'Date ajoutée.'};renderReglages();
}

/* THEME & NAV */
(function initTheme(){
  var root=document.documentElement;
  var stored=ls(KEY.theme);
  if(stored)root.setAttribute('data-theme',stored);
  el('themeBtn').onclick=function(){
    var cur=root.getAttribute('data-theme');
    var isDark=cur==='dark'||(!cur&&matchMedia('(prefers-color-scheme:dark)').matches);
    var next=isDark?'light':'dark';
    root.setAttribute('data-theme',next);lsSet(KEY.theme,next);
    el('themeBtn').textContent=next==='dark'?'☀':'☾';
  };
  var isDark=stored==='dark'||(!stored&&matchMedia('(prefers-color-scheme:dark)').matches);
  el('themeBtn').textContent=isDark?'☀':'☾';
})();

document.querySelectorAll('.topnav button').forEach(function(b){
  b.onclick=function(){
    if((S.quiz&&!S.quiz.done)||(S.exam&&!S.exam.done))return;
    S.quiz=null;S.exam=null;S.tab=b.dataset.tab;render();
  };
});

el('foot').textContent=totalQ()+' questions · '+Object.keys(MATIERES).length+' matières · '+getAcro().length+' acronymes · v1.1';
render();

</script>
