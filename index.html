<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révisions CQO</title>
<style>

:root{
  --bg:#f4f1ea;--surface:#ffffff;--surface-2:#f0ebdf;--line:#e0d9c8;
  --ink:#1b2435;--ink-soft:#5a6273;--navy:#182642;--navy-2:#2c4070;
  --gold:#b08628;--gold-2:#caa14a;
  --good:#2f7d50;--good-bg:#e7f1e9;--bad:#bc3b3b;--bad-bg:#f7e6e3;--warn:#c97a1b;
  --r:12px;--shadow:0 1px 2px rgba(20,29,51,.06),0 8px 20px rgba(20,29,51,.08);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424;--surface:#172034;--surface-2:#1f2a45;--line:#2b3758;
  --ink:#eae4d6;--ink-soft:#a3abbe;--navy:#0a0f1d;--navy-2:#30406c;
  --gold:#d4ab57;--gold-2:#e2bd72;
  --good:#5cbd84;--good-bg:#153021;--bad:#e28b85;--bad-bg:#371c1b;--warn:#e0a24e;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1424;--surface:#172034;--surface-2:#1f2a45;--line:#2b3758;
  --ink:#eae4d6;--ink-soft:#a3abbe;--navy:#0a0f1d;--navy-2:#30406c;
  --gold:#d4ab57;--gold-2:#e2bd72;
  --good:#5cbd84;--good-bg:#153021;--bad:#e28b85;--bad-bg:#371c1b;--warn:#e0a24e;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{line-height:1.2}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:1rem}
header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hbar{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px}
.brand{font-weight:800;font-size:1rem;letter-spacing:.01em;white-space:nowrap}
.brand b{color:var(--gold-2)}
.sp{flex:1}
.hico{background:rgba(255,255,255,.12);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:1rem;flex-shrink:0}
.hico:hover{background:rgba(255,255,255,.22)}
.topnav{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.08)}
.topnav::-webkit-scrollbar{display:none}
.topnav button{flex-shrink:0;padding:10px 16px;font-size:.82rem;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.55);border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
.topnav button[aria-selected="true"]{color:var(--gold-2);border-bottom-color:var(--gold-2)}
.topnav button:hover:not([aria-selected="true"]){color:rgba(255,255,255,.85)}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(16px,4vw,22px)}
.card+.card{margin-top:12px}
.eyebrow{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:.5rem}
.muted{color:var(--ink-soft);font-size:.88rem}
.small{font-size:.82rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:9px;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;border:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--gold);color:#fff}
.btn-primary:hover{background:var(--gold-2)}
.btn-secondary{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn-secondary:hover{border-color:var(--gold)}
.btn-danger{background:#c0392b;color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:7px}
.btn-block{width:100%;display:flex;margin-top:10px}
.opt-btn{width:100%;text-align:left;padding:14px 16px;border-radius:10px;font-size:.95rem;border:2px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:8px;line-height:1.4}
.opt-btn:hover:not(:disabled){border-color:var(--gold);background:var(--surface-2)}
.opt-btn.selected{border-color:var(--gold);background:var(--surface-2)}
.opt-btn.correct{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt-btn.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt-btn:disabled{cursor:default}
.opt-letter{font-weight:800;margin-right:10px;min-width:22px;display:inline-block}
.prog-wrap{background:var(--line);border-radius:99px;height:5px;margin:12px 0}
.prog-bar{height:5px;border-radius:99px;background:var(--gold);transition:width .3s}
.score-ring{display:flex;align-items:center;gap:16px;margin:16px 0}
.ring{width:88px;height:88px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
.ring-pct{font-size:1.4rem}
.ring-sub{font-size:.7rem;color:var(--ink-soft)}
.mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.mat-card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 12px;cursor:pointer;transition:border-color .15s,transform .1s}
.mat-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.mat-card.selected{border-color:var(--gold);background:var(--surface)}
.mat-card .mat-name{font-weight:700;font-size:.88rem;line-height:1.3}
.mat-card .mat-count{font-size:.75rem;color:var(--ink-soft);margin-top:4px}
.expl{background:var(--surface-2);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 8px 8px 0;margin-top:10px;font-size:.88rem;color:var(--ink-soft);line-height:1.5}
.flashcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center;min-height:180px;cursor:pointer;transition:transform .3s;box-shadow:var(--shadow)}
.flashcard:hover{transform:translateY(-2px)}
.flashcard .fc-q{font-size:1.05rem;font-weight:700;line-height:1.5}
.flashcard .fc-sep{margin:16px auto;width:40px;height:2px;background:var(--gold);border-radius:1px}
.flashcard .fc-a{font-size:.92rem;color:var(--good);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge-gold{background:var(--gold);color:#fff}
.nq-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.nq-btn{padding:7px 14px;border-radius:8px;font-size:.82rem;font-weight:700;border:2px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s}
.nq-btn.active{border-color:var(--gold);background:var(--surface-2);color:var(--gold)}
.field{margin-top:14px}
.lbl{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;margin-bottom:.4rem}
input[type=text],input[type=password],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:.95rem}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:transparent}
textarea{min-height:80px;resize:vertical}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opt-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);flex-shrink:0}
.opt-row input[type=text]{flex:1}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.88rem;font-weight:600}
.flash-ok{background:var(--good-bg);color:var(--good)}
.flash-err{background:var(--bad-bg);color:var(--bad)}
.qa-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qa-num{color:var(--gold);font-weight:800;min-width:28px;font-size:.85rem}
.qa-text{flex:1;font-size:.88rem;line-height:1.4}
.qa-acts{display:flex;gap:6px;flex-shrink:0}
footer{text-align:center;padding:16px;font-size:.75rem;color:var(--ink-soft);border-top:1px solid var(--line);margin-top:24px}
.empty{text-align:center;padding:48px 24px;color:var(--ink-soft)}
.empty .emo{font-size:2.5rem;margin-bottom:12px}
@media(max-width:480px){
  .topnav button{padding:9px 12px;font-size:.77rem}
  .mat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}

.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;border-radius:8px;padding:4px 6px 4px 0}
.brand:hover b{color:#fff}
.brand svg{color:var(--gold-2);flex-shrink:0}
.opt-btn.missed{border-color:var(--good);border-style:dashed;color:var(--good)}
.verdict{margin-top:6px;font-weight:800;font-size:.92rem}
.verdict.ok{color:var(--good)}
.verdict.ko{color:var(--bad)}
.multi-hint{font-size:.8rem;font-weight:700;color:var(--warn);margin-bottom:8px}
.tmr-wrap{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:-6px 0 14px}
.tmr-bar{height:100%;width:100%;background:var(--gold);transition:width .25s linear}
.tmr-bar.low{background:var(--bad)}
.timer-badge{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer-badge.low{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.quit-link{background:none;border:none;color:var(--ink-soft);font-size:.8rem;cursor:pointer;text-decoration:underline;padding:0}
.err-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.7rem;font-weight:700;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
.err-ko{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.err-ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lvl{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lvl-easy{background:var(--good-bg);color:var(--good);border:1px solid var(--good)}
.lvl-hard{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.test-facts{margin:8px 0 6px 18px;font-size:.88rem;color:var(--ink-soft);line-height:1.7}
.exam-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.exam-cell{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:.8rem;cursor:pointer}
.exam-cell.done{background:var(--gold);border-color:var(--gold);color:#fff}
.exam-cell.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.verdict-big{font-size:1.05rem;font-weight:800;margin:2px 0}
.verdict-big.ok{color:var(--good)}
.verdict-big.ko{color:var(--bad)}
</style>
</head>

<script>
var MATIERES = {"ILI":{"name":"Influence et Lutte Informationnelle","qs":[{"q":"Que signifie l'acronyme ILI ?","opts":[{"t":"Influence et Lutte Informationnelle","c":true},{"t":"Information et Logistique Interarm\u00e9es","c":false},{"t":"Ing\u00e9rence et Lutte Informatique","c":false},{"t":"Influence et Logique Interalli\u00e9e","c":false}],"e":"ILI = Influence et Lutte Informationnelle, enseign\u00e9e par la cellule d\u00e9di\u00e9e de l'\u00c9cole de l'Air et de l'Espace.","multi":false},{"q":"Selon la d\u00e9finition de l'OTAN, \u00ab influencer \u00bb revient \u00e0 : (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Alt\u00e9rer la perception","c":true},{"t":"Orienter le jugement","c":true},{"t":"Inciter \u00e0 l'action","c":true},{"t":"D\u00e9truire les infrastructures adverses","c":false}],"e":"Influencer = alt\u00e9rer la perception, orienter le jugement, inciter \u00e0 l'action. Ce n'est pas seulement convaincre, mais fa\u00e7onner la r\u00e9alit\u00e9 per\u00e7ue.","multi":true},{"q":"Quels sont les trois volets (approches) de l'influence ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Convaincre (logique, faits)","c":true},{"t":"S\u00e9duire (\u00e9motions, r\u00e9cits)","c":true},{"t":"Contraindre (pression, menace)","c":true},{"t":"Corrompre (achat d'agents)","c":false}],"e":"Les trois volets : convaincre (logique), s\u00e9duire (\u00e9motions), contraindre (pression). Ils sont souvent combin\u00e9s.","multi":true},{"q":"Un conflit \u00ab hybride \u00bb combine plusieurs leviers. Lesquels ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Militaire","c":true},{"t":"\u00c9conomique","c":true},{"t":"Cyber et informationnel","c":true},{"t":"Uniquement conventionnel et nucl\u00e9aire","c":false}],"e":"Hybride = combinaison militaire, \u00e9conomique, cyber et informationnel. Objectif : affaiblir l'adversaire sans confrontation directe (ex. Ukraine 2014 et 2022).","multi":true},{"q":"Quelle organisation a cr\u00e9\u00e9 l'East StratCom Task Force en 2015 pour contrer la d\u00e9sinformation pro-Kremlin ?","opts":[{"t":"L'Union europ\u00e9enne","c":true},{"t":"L'OTAN","c":false},{"t":"La France","c":false},{"t":"Les \u00c9tats-Unis","c":false}],"e":"L'UE cr\u00e9e l'East StratCom Task Force (2015). L'OTAN adopte une doctrine StratCom d\u00e8s 2009 ; la France l'int\u00e8gre dans la LPM 2024-2030.","multi":false},{"q":"En quelle ann\u00e9e l'OTAN a-t-elle adopt\u00e9 une doctrine StratCom ?","opts":[{"t":"2009","c":true},{"t":"2015","c":false},{"t":"2001","c":false},{"t":"2022","c":false}],"e":"OTAN : doctrine StratCom d\u00e8s 2009. (UE : East StratCom 2015 ; France : LPM 2024-2030.)","multi":false},{"q":"Quelle est la bonne d\u00e9finition de la PROPAGANDE ?","opts":[{"t":"Diffusion unilat\u00e9rale d'un message pour influencer l'opinion publique","c":true},{"t":"Actions psychologiques ciblant l'ennemi pour alt\u00e9rer son moral","c":false},{"t":"Ensemble d'actions couvertes ou ouvertes pour fa\u00e7onner les perceptions","c":false},{"t":"Interception de signaux \u00e9lectromagn\u00e9tiques","c":false}],"e":"Propagande = diffusion unilat\u00e9rale. Psyops = actions psychologiques ciblant l'ennemi. Op\u00e9rations d'influence = actions couvertes/ouvertes fa\u00e7onnant les perceptions.","multi":false},{"q":"L'op\u00e9ration WANDERING SOUL (Vietnam), diffusion de bandes audio simulant des voix de morts, est un exemple de :","opts":[{"t":"Psyops (op\u00e9ration psychologique)","c":true},{"t":"Propagande de masse","c":false},{"t":"Cyberattaque","c":false},{"t":"Social engineering","c":false}],"e":"Wandering Soul = psyops visant \u00e0 d\u00e9moraliser les Vietcongs en simulant les voix de leurs morts.","multi":false},{"q":"En 2017, des comptes li\u00e9s \u00e0 la Russie diffusent memes et articles pour exacerber les tensions raciales aux \u00c9tats-Unis. Le cours classe cela comme :","opts":[{"t":"Une op\u00e9ration d'influence","c":true},{"t":"De la propagande simple","c":false},{"t":"De la m\u00e9sinformation accidentelle","c":false},{"t":"Des psyops classiques","c":false}],"e":"Op\u00e9ration d'influence : elle combine d\u00e9sinformation, ciblage pr\u00e9cis et objectif strat\u00e9gique de division sociale.","multi":false},{"q":"Dans la typologie FIMI, comment nomme-t-on des contenus d\u00e9lib\u00e9r\u00e9ment faux cr\u00e9\u00e9s pour tromper ?","opts":[{"t":"D\u00e9sinformation","c":true},{"t":"M\u00e9sinformation","c":false},{"t":"Malinformation","c":false},{"t":"Contre-information","c":false}],"e":"D\u00e9sinformation = faux + intention de nuire. M\u00e9sinformation = inexact sans intention malveillante. Malinformation = vrai sorti de son contexte.","multi":false},{"q":"La MALINFORMATION d\u00e9signe :","opts":[{"t":"Des contenus vrais mais sortis de leur contexte ou exploit\u00e9s pour nuire (fuites, doxxing)","c":true},{"t":"Des informations fausses cr\u00e9\u00e9es pour tromper","c":false},{"t":"Des informations inexactes partag\u00e9es sans mauvaise intention","c":false},{"t":"Des rumeurs anodines sans impact","c":false}],"e":"Malinformation = vrai mais d\u00e9tourn\u00e9 pour nuire. Ex. : document authentique publi\u00e9 pour discr\u00e9diter un responsable.","multi":false},{"q":"Dans le cours, que d\u00e9signe l'acronyme FIMI ?","opts":[{"t":"Flux d'Information Malveillante et Illicite","c":true},{"t":"Force d'Intervention Militaire Interalli\u00e9e","c":false},{"t":"Fichier d'Identification Militaire Informatis\u00e9","c":false},{"t":"Flux Internet Massivement Ill\u00e9gal","c":false}],"e":"FIMI = menace \u00ab Flux d'Information Malveillante et Illicite \u00bb : contenus visant \u00e0 d\u00e9sinformer, manipuler, influencer et d\u00e9stabiliser.","multi":false},{"q":"Selon l'arm\u00e9e fran\u00e7aise, la lutte informationnelle (LI) vise \u00e0 : (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Prot\u00e9ger","c":true},{"t":"Contester","c":true},{"t":"Neutraliser","c":true},{"t":"Coloniser","c":false}],"e":"LI = prot\u00e9ger, contester, neutraliser dans le champ informationnel.","multi":true},{"q":"Dans le concept ILI des arm\u00e9es fran\u00e7aises, qui fixe la strat\u00e9gie d'influence des arm\u00e9es ?","opts":[{"t":"Le CEMA (Chef d'\u00c9tat-Major des Arm\u00e9es)","c":true},{"t":"Le ministre de l'Int\u00e9rieur","c":false},{"t":"VIGINUM","c":false},{"t":"Le Pr\u00e9sident de la R\u00e9publique seul","c":false}],"e":"Le CEMA fixe la strat\u00e9gie d'influence, valide les narratifs et les ROE ; il est assist\u00e9 d'un conseiller influence (cellule ASO).","multi":false},{"q":"Quelle affirmation distingue correctement STRATCOM et LI ?","opts":[{"t":"STRATCOM = cadre global de planification ; LI = action militaire cibl\u00e9e dans le champ informationnel","c":true},{"t":"LI = cadre global ; STRATCOM = simple action de terrain","c":false},{"t":"Les deux sont strictement synonymes","c":false},{"t":"STRATCOM ne concerne que le cyber","c":false}],"e":"STRATCOM (OTAN) = coordination et alignement de toutes les actions de communication. LI = action militaire cibl\u00e9e.","multi":false},{"q":"Les Info Ops (OTAN) int\u00e8grent plusieurs disciplines. Lesquelles ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Op\u00e9rations psychologiques (PSYOPS)","c":true},{"t":"Guerre \u00e9lectronique (EW)","c":true},{"t":"D\u00e9ception (tromperie) militaire","c":true},{"t":"Gestion du carburant des bases","c":false}],"e":"Info Ops OTAN = PSYOPS, guerre \u00e9lectronique, s\u00e9curit\u00e9 des informations, d\u00e9ception militaire, op\u00e9rations de s\u00e9curit\u00e9 publique.","multi":true},{"q":"En 525 av. J.-C., quel g\u00e9n\u00e9ral perse diffuse de fausses informations pour semer la discorde chez les \u00c9gyptiens ?","opts":[{"t":"Cambyse","c":true},{"t":"Darius III","c":false},{"t":"Xerx\u00e8s","c":false},{"t":"Cyrus le Grand","c":false}],"e":"Cambyse (525 av. J.-C.) : exemple montrant que l'information est une arme tr\u00e8s ancienne.","multi":false},{"q":"Comment Alexandre le Grand construit-il son mythe ? (Plusi e9e \u00bb de Napol\u00e9on servaient surtout \u00e0 :","opts":[{"t":"Glorifier les victoires et masquer les \u00e9checs","c":true},{"t":"Donner des ordres logistiques pr\u00e9cis","c":false},{"t":"Informer objectivement la population","c":false},{"t":"Coordonner les arm\u00e9es alli\u00e9es","c":false}],"e":"Les Bulletins exag\u00e8rent les pertes ennemies et minimisent les pertes fran\u00e7aises, d'o\u00f9 l'expression \u00ab mentir comme un bulletin \u00bb.","multi":false},{"q":"\u00ab Les races sup\u00e9rieures ont un droit sur les races inf\u00e9rieures \u00bb (1885) : ce discours justifiant la colonisation est de :","opts":[{"t":"Jules Ferry","c":true},{"t":"Napol\u00e9on III","c":false},{"t":"Georges Clemenceau","c":false},{"t":"Jules Verne","c":false}],"e":"Jules Ferry (1885) : illustration de la propagande de la \u00ab mission civilisatrice \u00bb sous la IIIe R\u00e9publique.","multi":false},{"q":"Durant la Premi\u00e8re Guerre mondiale, la propagande de masse recourt notamment \u00e0 : (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"La diabolisation de l'ennemi","c":true},{"t":"La censure de la presse","c":true},{"t":"Les films de propagande","c":true},{"t":"Les r\u00e9seaux sociaux","c":false}],"e":"1914-1918 = naissance de la propagande de masse : diabolisation (\u00ab les Huns \u00bb), censure, affiches, films.","multi":true},{"q":"Qui \u00e9tait le ministre de la Propagande de l'Allemagne nazie, architecte du culte d'Hitler ?","opts":[{"t":"Joseph Goebbels","c":true},{"t":"Heinrich Himmler","c":false},{"t":"Martin Bormann","c":false},{"t":"Leni Riefenstahl","c":false}],"e":"Goebbels orchestre films, radio et meetings. Leni Riefenstahl r\u00e9alise le film \u00ab Triomphe de la volont\u00e9 \u00bb.","multi":false},{"q":"Pendant la Guerre froide, quels outils nouveaux sont employ\u00e9s dans la guerre id\u00e9ologique ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"La t\u00e9l\u00e9vision","c":true},{"t":"Les radios (Radio Free Europe, Voice of ue},{"t":"Des erreurs de raisonnement toujours volontaires","c":false},{"t":"Des logiciels malveillants","c":false},{"t":"Des techniques de chiffrement","c":false}],"e":"Les biais sont des m\u00e9canismes inconscients, utiles pour d\u00e9cider vite, mais exploitables dans la d\u00e9sinformation.","multi":false},{"q":"Le biais de confirmation est la tendance \u00e0 :","opts":[{"t":"Croire ce qui conforte nos opinions existantes","c":true},{"t":"Faire confiance \u00e0 une autorit\u00e9 per\u00e7ue comme l\u00e9gitime","c":false},{"t":"Juger selon ce qui vient facilement \u00e0 l'esprit","c":false},{"t":"Suivre l'avis de la majorit\u00e9","c":false}],"e":"Biais de confirmation : croire ce qui valide nos croyances. C'est la porte d'entr\u00e9e de la \u00ab bulle informationnelle \u00bb.","multi":false},{"q":"\u00ab Confiance excessive dans une source per\u00e7ue comme l\u00e9gitime (expert, m\u00e9dia, grade) \u00bb d\u00e9crit :","opts":[{"t":"Le biais d'autorit\u00e9","c":true},{"t":"Le biais de disponibilit\u00e9","c":false},{"t":"L'effet de halo","c":false},{"t":"Le biais d'ancrage","c":false}],"e":"Biais d'autorit\u00e9 : une fausse information relay\u00e9e par un faux expert ou un m\u00e9dia usurp\u00e9 para\u00eet cr\u00e9dible.","multi":false},{"q":"Le biais de disponibilit\u00e9 conduit \u00e0 :","opts":[{"t":"Juger la probabilit\u00e9 d'un \u00e9v\u00e9nement selon ce qui vient facilement \u00e0 l'esprit (image choc, actualit\u00e9 r\u00e9cente)","c":true},{"t":"Suivre syst\u00e9matiquement la majorit\u00e9","c":false},{"t":"Se fier d'abord \u00e0 un expert","c":false},{"t":"Rester bloqu\u00e9 sur la premi\u00e8re information re\u00e7ue","c":false}],"e":"Biais de disponibilit\u00e9 : une image choc ou un deepfake marque la m\u00e9moire bien plus qu'un d\u00e9menti. Il s'appuie sur la Loi de Brandolini.","multi":false},{"q":"La \u00ab Loi de Brandolini \u00bb \u00e9nonce que :","opts":[{"t":"L'\u00e9nergie n\u00e9cessaire pour r\u00e9futer des sottises est bien  trafic Tor sert l'acc\u00e8s anonyme au web classique. Le Darknet repr\u00e9sente ~0,01 \u00e0 0,1 % du trafic global.","multi":false},{"q":"En quoi consiste une technique \u00ab Hack & leak \u00bb ?","opts":[{"t":"Pirater un syst\u00e8me puis diffuser des informations sensibles pour influencer l'opinion","c":true},{"t":"Chiffrer les donn\u00e9es d'une victime contre une ran\u00e7on","c":false},{"t":"Saturer un serveur de requ\u00eates","c":false},{"t":"Usurper une adresse e-mail","c":false}],"e":"Hack & leak : ex. les mails du DNC (2016) diffus\u00e9s via WikiLeaks puis amplifi\u00e9s par bots et troll farms.","multi":false},{"q":"L'exemple des mails du DNC (2016) illustre surtout :","opts":[{"t":"La convergence entre cyberattaque et lutte informationnelle","c":true},{"t":"Une simple fuite accidentelle","c":false},{"t":"Une attaque uniquement financi\u00e8re","c":false},{"t":"Un cas de social engineering physique","c":false}],"e":"Un piratage technique sert de levier \u00e0 une campagne de d\u00e9sinformation : le cyber devient multiplicateur d'effet.","multi":false},{"q":"Pourquoi l'application STRAVA (2017) est-elle cit\u00e9e comme cas d'\u00e9cole de s\u00e9curit\u00e9 op\u00e9rationnelle ?","opts":[{"t":"Sa heatmap GPS a r\u00e9v\u00e9l\u00e9 la localisation et les \u00ab patterns of life \u00bb de bases militaires isol\u00e9es","c":true},{"t":"Elle a \u00e9t\u00e9 pirat\u00e9e par la Russie","c":false},{"t":"Elle diffusait des deepfakes","c":false},{"t":"Elle h\u00e9bergeait un march\u00e9 darknet","c":false}],"e":"La heatmap STRAVA (2017) r\u00e9v\u00e8le contours de bases, heures d'activit\u00e9 et parcours de patrouille : la s\u00e9curit\u00e9 personnelle est indissociable de la s\u00e9curit\u00e9 collective.","multi":false},{"q":"Quels facteurs font du cyber un \u00ab multiplicateur d'effet informationnel \u00bb ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"La rapidit\u00e9 (transmission instantan\u00e9e)","c":true},{"t":"La port\u00e9e globale (f urd'hui la politique de d\u00e9fense ?","opts":[{"t":"Le Code de la D\u00e9fense","c":true},{"t":"Le Livre blanc de 2013","c":false},{"t":"L'ordonnance du 7 janvier 1959","c":false},{"t":"La Constitution de 1958","c":false}],"e":"Le Code de la D\u00e9fense dispose que la politique de d\u00e9fense a pour objet d'assurer l'int\u00e9grit\u00e9 du territoire et la protection de la population contre les agressions arm\u00e9es (art. L1111-1).","multi":false},{"q":"\u00c0 quel objectif la politique de d\u00e9fense fran\u00e7aise ne r\u00e9pond PAS ?","opts":[{"t":"\u00catre capable de mener une offensive militaire","c":true},{"t":"Respecter ses engagements","c":false},{"t":"D\u00e9fendre ses int\u00e9r\u00eats fondamentaux","c":false},{"t":"Construire un environnement international stable","c":false}],"e":"Les trois objectifs sont : construire un environnement international stable, respecter ses engagements et d\u00e9fendre ses int\u00e9r\u00eats fondamentaux. Mener une offensive n'en fait pas partie.","multi":false},{"q":"Quels sont les trois types d'int\u00e9r\u00eats fondamentaux de la France ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Vitaux","c":true},{"t":"Strat\u00e9giques","c":true},{"t":"De puissance","c":true},{"t":"Dissuasifs","c":false}],"e":"Les trois types d'int\u00e9r\u00eats sont : vitaux, strat\u00e9giques et de puissance. \u00ab Dissuasifs \u00bb n'est pas une cat\u00e9gorie d'int\u00e9r\u00eats.","multi":true},{"q":"Lequel ne fait PAS partie des trois types d'int\u00e9r\u00eats fondamentaux ?","opts":[{"t":"Dissuasifs","c":true},{"t":"Strat\u00e9giques","c":false},{"t":"De puissance","c":false},{"t":"Vitaux","c":false}],"e":"Les trois types d'int\u00e9r\u00eats sont vitaux, strat\u00e9giques et de puissance ; \u00ab dissuasifs \u00bb n'en fait pas partie.","multi":false},{"q":"Combien de puissances nucl\u00e9aires officielles comptait-on en 2026 ?","opts":[{"t":"9","c":true},{"t":"8","c":false},{"t":"10","c":false},{"t":"15","c":false}],"e":"On comptait 9 puissances nucl\u00e9aires officielles en 2026.","multi":false},{"q":"Quelle affirmation est FAUSSE concernant la guerre hybride ?","opts":[{"t":"Le responsable d'une attaque est toujours un acteur \u00e9tatique","c":true},{"t":"Elle a recours \u00e0 des moyens conventionnels de combat","c":false},{"t":"Elle utilise des moyens asym\u00e9triques tels que le cyberespace","c":false},{"t":"Les outils de communication de masse et de propagande sont utilis\u00e9s comme armes","c":false}],"e":"La guerre hybride se caract\u00e9rise justement par la difficult\u00e9 d'attribution : le responsable n'est pas toujours un acteur \u00e9tatique.","multi":false},{"q":"Quels sont les cinq milieux (champs) de conflictualit\u00e9 contemporains ?","opts":[{"t":"Terrestre / Maritime / A\u00e9rien / Espace / Num\u00e9rique","c":true},{"t":"Terrestre / Maritime / A\u00e9rien / Soft power / Hard power","c":false},{"t":"Terrestre / Maritime / A\u00e9rien / Haute altitude / Num\u00e9rique","c":false},{"t":"Terrestre / Maritime / A\u00e9rien / Espace / Eaux profondes","c":false}],"e":"Les cinq milieux de conflictualit\u00e9 sont : terrestre, maritime, a\u00e9rien, espace (exo-atmosph\u00e9rique) et num\u00e9rique (cyber).","multi":false},{"q":"Que signifie l'acronyme BITD ?","opts":[{"t":"Base industrielle et technologique de d\u00e9fense","c":true},{"t":"Base industrielle et transformation de d\u00e9fense","c":false},{"t":"Base innovation et technologique de d\u00e9fense","c":false},{"t":"Basic individual training device","c":false}],"e":"BITD = Base industrielle et technologique de d\u00e9fense : l'ensemble des entreprises contribuant aux \u00e9quipements de d\u00e9fense.","multi":false},{"q":"Quelles sont les cinq fonctions strat\u00e9giques issues du Livre blanc de 2013 ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Connaissance et anticipation","c":true},{"t":"Pr\u00e9vention","c":true},{"t":"Protection","c":true},{"t":"Intervention","c":true},{"t":"Dissuasion","c":true},{"t":"Influence","c":false}],"e":"Les cinq fonctions strat\u00e9giques de 2013 sont : connaissance-anticipation, pr\u00e9vention, protection, intervention et dissuasion. L'influence (ainsi que compr\u00e9hension et r\u00e9silience) n'est ajout\u00e9e qu'en 2022.","multi":true},{"q":"Quelle fonction strat\u00e9gique a \u00e9t\u00e9 ajout\u00e9e par la Revue nationale strat\u00e9gique de 2022 ?","opts":[{"t":"L'influence","c":true},{"t":"La dissuasion","c":false},{"t":"La protection","c":false},{"t":"L'intervention","c":false}],"e":"En 2022, l'influence est ajout\u00e9e aux fonctions strat\u00e9giques (de m\u00eame que la compr\u00e9hension et la r\u00e9silience viennent enrichir les fonctions existantes).","multi":false},{"q":"Comment la dissuasion nucl\u00e9aire est-elle d\u00e9finie dans le cours ?","opts":[{"t":"Une doctrine d\u00e9fensive fond\u00e9e sur la capacit\u00e9 \u00e0 infliger des dommages inacceptables \u00e0 un agresseur","c":true},{"t":"Une doctrine offensive visant \u00e0 d\u00e9truire les capacit\u00e9s adverses","c":false},{"t":"Une strat\u00e9gie d'emploi syst\u00e9matique de l'arme atomique","c":false},{"t":"Une politique de d\u00e9sarmement unilat\u00e9ral","c":false}],"e":"La dissuasion nucl\u00e9aire est une doctrine d\u00e9fensive : elle repose sur la capacit\u00e9 \u00e0 infliger des dommages inacceptables \u00e0 un adversaire qui voudrait attaquer.","multi":false},{"q":"Quelle est la \u00ab triade \u00bb des vecteurs de la dissuasion nucl\u00e9aire ?","opts":[{"t":"Terrestre, a\u00e9rien et maritime","c":true},{"t":"Terrestre, spatial et maritime","c":false},{"t":"A\u00e9rien, maritime et cyber","c":false},{"t":"Terrestre, a\u00e9rien et spatial","c":false}],"e":"La triade nucl\u00e9aire d\u00e9signe les trois vecteurs possibles : terrestre, a\u00e9rien et maritime.","multi":false},{"q":"Sur quels deux vecteurs repose la dissuasion nucl\u00e9aire fran\u00e7aise ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"La Force oc\u00e9anique strat\u00e9gique (FOST)","c":true},{"t":"Les Forces a\u00e9riennes strat\u00e9giques (FAS)","c":true},{"t":"La composante terrestre balistique","c":false},{"t":"La composante spatiale","c":false}],"e":"La France ne dispose que de deux composantes : oc\u00e9anique (FOST) et a\u00e9roport\u00e9e (FAS). Elle a renonc\u00e9 \u00e0 la composante terrestre.","multi":true},{"q":"Quels sont les trois grands principes de la dissuasion nucl\u00e9aire ?","opts":[{"t":"Permanence / Cr\u00e9dibilit\u00e9 / Quantit\u00e9 et Qualit\u00e9","c":true},{"t":"Permanence / Cr\u00e9dibilit\u00e9 / Quantit\u00e9 et Perfection","c":false},{"t":"Instantan\u00e9it\u00e9 / \u00c9quilibre / Quantit\u00e9 et Qualit\u00e9","c":false},{"t":"Permanence / \u00c9quilibre / Quantit\u00e9 et Qualit\u00e9","c":false}],"e":"Les trois principes sont la permanence, la cr\u00e9dibilit\u00e9 et la quantit\u00e9/qualit\u00e9 de l'arsenal.","multi":false},{"q":"La dissuasion nucl\u00e9aire est souvent qualifi\u00e9e d'arme de \u00ab non-emploi \u00bb. Pourquoi ?","opts":[{"t":"Elle vise \u00e0 persuader plut\u00f4t qu'\u00e0 \u00eatre employ\u00e9e ; c'est une arme diplomatique","c":true},{"t":"Elle est trop ancienne pour \u00eatre utilis\u00e9e","c":false},{"t":"Elle est interdite par le droit international","c":false},{"t":"Elle n'est pas op\u00e9rationnelle","c":false}],"e":"La dissuasion repose sur la persuasion : c'est une arme de non-emploi, diplomatique, illustrant le \u00ab pouvoir \u00e9galisateur de l'atome \u00bb.","multi":false},{"q":"Quels sont les trois moyens de la \u00ab remont\u00e9e en puissance \u00bb de la France ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Le renforcement de l'autonomie strat\u00e9gique","c":true},{"t":"Un mod\u00e8le d'arm\u00e9e complet et \u00e9quilibr\u00e9","c":true},{"t":"Une ambition industrielle et technologique forte","c":true},{"t":"La r\u00e9duction du format des arm\u00e9es","c":false}],"e":"Les trois moyens sont : renforcement de l'autonomie strat\u00e9gique, mod\u00e8le d'arm\u00e9e complet et \u00e9quilibr\u00e9, et ambition industrielle et technologique forte.","multi":true},{"q":"Qui \u00e9labore la strat\u00e9gie de d\u00e9fense fran\u00e7aise au sein du minist\u00e8re des Arm\u00e9es ?","opts":[{"t":"La DGRIS","c":true},{"t":"L'EMA","c":false},{"t":"Le MINARM","c":false},{"t":"La DGSE","c":false}],"e":"La DGRIS (Direction g\u00e9n\u00e9rale des relations internationales et de la strat\u00e9gie) \u00e9labore la strat\u00e9gie de d\u00e9fense.","multi":false},{"q":"Lequel de ces enjeux actuels de la politique de d\u00e9fense n'est PAS cit\u00e9 dans le cours ?","opts":[{"t":"La conqu\u00eate de nouveaux territoires coloniaux","c":true},{"t":"Le terrorisme","c":false},{"t":"Les cybermenaces","c":false},{"t":"Le changement climatique","c":false}],"e":"Les enjeux cit\u00e9s sont notamment le terrorisme, les cybermenaces, la prolif\u00e9ration nucl\u00e9aire, l'hybridation des conflits et le changement climatique ; la conqu\u00eate coloniale n'en fait pas partie.","multi":false},{"q":"Quels sont les deux textes r\u00e9gissant l'organisation des pouvoirs en mati\u00e8re de d\u00e9fense ?","opts":[{"t":"La Constitution de la Ve R\u00e9publique et le Code de la d\u00e9fense","c":true},{"t":"Le Livre blanc et le Code de la d\u00e9fense","c":false},{"t":"La Constitution de la Ve R\u00e9publique et le Livre blanc","c":false},{"t":"La Constitution de la Ve R\u00e9publique et le Code du travail","c":false}],"e":"L'organisation des pouvoirs en mati\u00e8re de d\u00e9fense repose sur la Constitution de la Ve R\u00e9publique et le Code de la d\u00e9fense.","multi":false},{"q":"Quelle est la date de promulgation de la Constitution de la Ve R\u00e9publique ?","opts":[{"t":"Octobre 1958","c":true},{"t":"D\u00e9cembre 1958","c":false},{"t":"Juin 1958","c":false},{"t":"Octobre 1959","c":false}],"e":"La Constitution de la Ve R\u00e9publique a \u00e9t\u00e9 promulgu\u00e9e en octobre 1958.","multi":false},{"q":"Quels sont les deux \u00ab domaines r\u00e9serv\u00e9s \u00bb du pr\u00e9sident de la R\u00e9publique ?","opts":[{"t":"La D\u00e9fense et la Politique \u00e9trang\u00e8re","c":true},{"t":"La D\u00e9fense et la Sant\u00e9","c":false},{"t":"La D\u00e9fense et la Politique int\u00e9rieure","c":false},{"t":"L'\u00c9ducation et la Politique \u00e9trang\u00e8re","c":false}],"e":"Les domaines r\u00e9serv\u00e9s du pr\u00e9sident sont la D\u00e9fense et la Politique \u00e9trang\u00e8re.","multi":false},{"q":"Selon l'article 5 de la Constitution de 1958, le pr\u00e9sident de la R\u00e9publique est :","opts":[{"t":"Le \u00ab garant de l'ind\u00e9pendance nationale et de l'int\u00e9grit\u00e9 du territoire \u00bb","c":true},{"t":"Le \u00ab responsable de la d\u00e9fense nationale \u00bb","c":false},{"t":"Le \u00ab chef du Gouvernement \u00bb","c":false},{"t":"Le \u00ab premier des magistrats \u00bb","c":false}],"e":"L'article 5 fait du pr\u00e9sident le garant de l'ind\u00e9pendance nationale et de l'int\u00e9grit\u00e9 du territoire ; l'article 15 en fait le chef des arm\u00e9es.","multi":false},{"q":"Quels sont les deux contrepouvoirs au pr\u00e9sident de la R\u00e9publique en mati\u00e8re de d\u00e9fense ?","opts":[{"t":"Le Parlement et le Premier ministre","c":true},{"t":"Le Parlement et le Conseil constitutionnel","c":false},{"t":"Le Premier ministre et le chef d'\u00e9tat-major des Arm\u00e9es","c":false},{"t":"Le S\u00e9nat et l'Assembl\u00e9e nationale","c":false}],"e":"Les contrepouvoirs du pr\u00e9sident en mati\u00e8re de d\u00e9fense sont le Parlement et le Premier ministre.","multi":false},{"q":"Qui pr\u00e9side le Conseil de d\u00e9fense et de s\u00e9curit\u00e9 nationale (CDSN) ?","opts":[{"t":"Le pr\u00e9sident de la R\u00e9publique","c":true},{"t":"Le Premier ministre","c":false},{"t":"Le ministre des Arm\u00e9es","c":false},{"t":"Le chef d'\u00e9tat-major des Arm\u00e9es","c":false}],"e":"Le CDSN, conseil des ministres en format restreint, est pr\u00e9sid\u00e9 par le pr\u00e9sident de la R\u00e9publique.","multi":false},{"q":"Quelles sont les trois formations sous lesquelles le CDSN peut se r\u00e9unir ?","opts":[{"t":"Pl\u00e9ni\u00e8re / Restreinte / Sp\u00e9cialis\u00e9e","c":true},{"t":"Pl\u00e9ni\u00e8re / Restreinte / Cibl\u00e9e","c":false},{"t":"Pl\u00e9ni\u00e8re / Restreinte / Hebdomadaire","c":false},{"t":"G\u00e9n\u00e9rale / Restreinte / Sp\u00e9cialis\u00e9e","c":false}],"e":"Le CDSN se r\u00e9unit en formation pl\u00e9ni\u00e8re, restreinte ou sp\u00e9cialis\u00e9e (Conseil national du renseignement, Conseil de l'armement nucl\u00e9aire).","multi":false},{"q":"Selon l'article 21 de la Constitution de 1958, qui est \u00ab responsable de la D\u00e9fense nationale \u00bb ?","opts":[{"t":"Le Premier ministre","c":true},{"t":"Le pr\u00e9sident de la R\u00e9publique","c":false},{"t":"Le ministre des Arm\u00e9es","c":false},{"t":"Le chef d'\u00e9tat-major des Arm\u00e9es","c":false}],"e":"L'article 21 fait du Premier ministre le responsable de la D\u00e9fense nationale ; il assume la direction g\u00e9n\u00e9rale et militaire de la d\u00e9fense.","multi":false},{"q":"Quelles comp\u00e9tences le Parlement exerce-t-il en mati\u00e8re de d\u00e9fense ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"Le vote du budget","c":true},{"t":"L'adoption des lois de programmation militaire","c":true},{"t":"L'autorisation de la prolongation des interventions ext\u00e9rieures au-del\u00e0 de 4 mois","c":true},{"t":"La nomination du chef d'\u00e9tat-major des Arm\u00e9es","c":false}],"e":"Le Parlement vote le budget, adopte les LPM et autorise la prolongation des OPEX au-del\u00e0 de 4 mois (art. 35). Il ne nomme pas le CEMA.","multi":true},{"q":"Selon l'article 35 de la Constitution, sous quel d\u00e9lai le Gouvernement informe-t-il le Parlement d'une intervention des forces arm\u00e9es \u00e0 l'\u00e9tranger ?","opts":[{"t":"Au plus tard trois jours apr\u00e8s le d\u00e9but de l'intervention","c":true},{"t":"Avant toute intervention","c":false},{"t":"Au plus tard une semaine apr\u00e8s","c":false},{"t":"Au plus tard un mois apr\u00e8s","c":false}],"e":"L'article 35 impose d'informer le Parlement au plus tard trois jours apr\u00e8s le d\u00e9but de l'intervention ; au-del\u00e0 de quatre mois, la prolongation doit \u00eatre autoris\u00e9e.","multi":false},{"q":"De quoi le ministre des Arm\u00e9es (MINARM) est-il responsable ?","opts":[{"t":"De la pr\u00e9paration et de la mise en \u0153uvre de la politique de d\u00e9fense","c":true},{"t":"De la direction g\u00e9n\u00e9rale de la Nation","c":false},{"t":"Du vote du budget de la d\u00e9fense","c":false},{"t":"De la conduite des conseils de d\u00e9fense","c":false}],"e":"Le ministre des Arm\u00e9es est responsable de la pr\u00e9paration et de la mise en \u0153uvre de la politique de d\u00e9fense et a autorit\u00e9 sur les arm\u00e9es et leurs services.","multi":false},{"q":"Quel est le r\u00f4le principal du chef d'\u00e9tat-major des Arm\u00e9es (CEMA) ?","opts":[{"t":"Conseiller militaire du ministre, responsable de la pr\u00e9paration et de l'emploi des forces","c":true},{"t":"Responsable de l'\u00e9quipement et de l'armement des forces","c":false},{"t":"Responsable de l'administration g\u00e9n\u00e9rale du minist\u00e8re","c":false},{"t":"Pr\u00e9sident du Conseil de d\u00e9fense","c":false}],"e":"Le CEMA assiste le ministre comme conseiller militaire et est responsable de la pr\u00e9paration et de l'emploi des forces ; il a autorit\u00e9 sur les chefs d'\u00e9tat-major d'arm\u00e9e.","multi":false},{"q":"Le CEMA a autorit\u00e9 sur les chefs d'\u00e9tat-major de quelles arm\u00e9es ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"L'arm\u00e9e de Terre (CEMAT)","c":true},{"t":"La Marine (CEMM)","c":true},{"t":"L'arm\u00e9e de l'Air et de l'Espace (CEMAAE)","c":true},{"t":"La Gendarmerie nationale","c":false}],"e":"Le CEMA a autorit\u00e9 sur le CEMAT (Terre), le CEMM (Marine) et le CEMAAE (Air et Espace). La Gendarmerie rel\u00e8ve du minist\u00e8re de l'Int\u00e9rieur.","multi":true},{"q":"Quel organisme est responsable de l'\u00e9quipement des arm\u00e9es et aide au d\u00e9veloppement de la BITD ?","opts":[{"t":"La DGA (Direction g\u00e9n\u00e9rale de l'armement)","c":true},{"t":"Le SGA (Secr\u00e9tariat g\u00e9n\u00e9ral pour l'administration)","c":false},{"t":"La DGRIS","c":false},{"t":"La DGSE","c":false}],"e":"La DGA est responsable de l'\u00e9quipement des arm\u00e9es, pilote la pr\u00e9paration des syst\u00e8mes futurs et soutient la BITD.","multi":false},{"q":"Que signifie l'acronyme SGA, organisme entourant le ministre des Arm\u00e9es ?","opts":[{"t":"Secr\u00e9tariat g\u00e9n\u00e9ral pour l'administration","c":true},{"t":"Service g\u00e9n\u00e9ral des arm\u00e9es","c":false},{"t":"Secr\u00e9tariat de gestion de l'armement","c":false},{"t":"Service de garnison des arm\u00e9es","c":false}],"e":"Le SGA (Secr\u00e9tariat g\u00e9n\u00e9ral pour l'administration) assiste le ministre dans l'administration g\u00e9n\u00e9rale du minist\u00e8re (environ 14 000 personnes).","multi":false},{"q":"Quelles sont les trois grandes cat\u00e9gories d'armes de l'arm\u00e9e de Terre ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"La m\u00eal\u00e9e (infanterie, cavalerie\u2026)","c":true},{"t":"L'appui (artillerie, g\u00e9nie)","c":true},{"t":"Le soutien (transmission, train, mat\u00e9riel)","c":true},{"t":"La dissuasion","c":false}],"e":"L'arm\u00e9e de Terre distingue trois types d'armes : la m\u00eal\u00e9e, l'appui et le soutien.","multi":true},{"q":"Quelle est l'unit\u00e9 qui structure l'arm\u00e9e de Terre ?","opts":[{"t":"Le r\u00e9giment","c":true},{"t":"La brigade","c":false},{"t":"La compagnie","c":false},{"t":"La division","c":false}],"e":"Le r\u00e9giment est l'unit\u00e9 structurant l'arm\u00e9e de Terre (environ 90 r\u00e9giments), subdivis\u00e9 en compagnies, sections et groupes.","multi":false},{"q":"Combien de bases a\u00e9riennes la France compte-t-elle en m\u00e9tropole et outre-mer ?","opts": nd date l'expression \u00ab s\u00e9curit\u00e9 collective \u00bb ?","opts":[{"t":"Des ann\u00e9es 1930","c":true},{"t":"Des ann\u00e9es 1950","c":false},{"t":"Des ann\u00e9es 1990","c":false},{"t":"De l'apr\u00e8s-guerre froide","c":false}],"e":"L'expression \u00ab s\u00e9curit\u00e9 collective \u00bb date des ann\u00e9es 1930.","multi":false},{"q":"Sur quels deux principes majeurs repose la s\u00e9curit\u00e9 collective ? (Plusieurs r\u00e9ponses possibles)","opts":[{"t":"L'interdiction du recours \u00e0 la force","c":true},{"t":"La solidarit\u00e9 internationale","c":true},{"t":"La sup\u00e9riorit\u00e9 nucl\u00e9aire","c":false},{"t":"L'autonomie strat\u00e9gique nationale","c":false}],"e":"La s\u00e9curit\u00e9 collective repose sur l'interdiction du recours \u00e0 la force et la solidarit\u00e9 internationale.","multi":true},{"q":"Quel trait\u00e9 de 1992 donne naissance \u00e0 l'Union europ\u00e9enne ?","opts":[{"t":"Le trait\u00e9 de Maastricht","c":true},{"t":"Le trait\u00e9 de Rome","c":false},{"t":"Le trait\u00e9 de Lisbonne","c":false},{"t":"Le trait\u00e9 de Nice","c":false}],"e":"Le trait\u00e9 de Maastricht (1992) donne naissance \u00e0 l'Union europ\u00e9enne.","multi":false},{"q":"Quel trait\u00e9, sign\u00e9 en 1951, cr\u00e9e la CECA ?","opts":[{"t":"Le trait\u00e9 de Paris","c":true},{"t":"Le trait\u00e9 de Rome","c":false},{"t":"Le trait\u00e9 de Bruxelles","c":false},{"t":"Le trait\u00e9 de Maastricht","c":false}],"e":"Le trait\u00e9 de Paris (1951) cr\u00e9e la Communaut\u00e9 europ\u00e9enne du charbon et de l'acier (CECA).","multi":false},{"q":"Quel \u00e9v\u00e9nement marque l'\u00e9chec de la Communaut\u00e9 europ\u00e9enne de d\u00e9fense (CED) ?","opts":[{"t":"Le refus fran\u00e7ais en 1954","c":true},{"t":"Le rejet britannique en 1952","c":false},{"t":"L'\u00e9chec du r\u00e9f\u00e9rendum de 2005","c":false},{"t":"Le retrait allemand en 1957","c":false}],"e":"La CED (1952) \u00e9choue \u00e0 la suite du refus fran\u00e7ais en 1954.","mul omatique","c":false},{"t":"Inexistante","c":false}],"e":"T\u00e9l\u00e9guidage : conduite de tir manuelle (op\u00e9rateur avec/sans lunette de vis\u00e9e) ou automatique. Ex. : Eryx (direct), Patriot (indirect).","multi":false},{"q":"Pourquoi le guidage est-il n\u00e9cessaire ?","opts":[{"t":"\u00c0 cause des man\u0153uvres de la cible (d\u00e9robade)","c":true},{"t":"\u00c0 cause des syst\u00e8mes d'autod\u00e9fense de la cible","c":true},{"t":"\u00c0 cause du bruit de fond et des brouilleurs","c":true},{"t":"\u00c0 cause de la couleur du missile","c":false}],"e":"Guidage n\u00e9cessaire : man\u0153uvres de la cible, autod\u00e9fense, bruit de fond (cible, milieu, brouilleurs), turbulences de l'air, tol\u00e9rances industrielles.","multi":true},{"q":"Le missile Eryx est un exemple de :","opts":[{"t":"T\u00e9l\u00e9guidage direct","c":true},{"t":"T\u00e9l\u00e9guidage indirect","c":false},{"t":"Autoguidage actif","c":false},{"t":"Autoguidage passif","c":false}],"e":"Eryx : t\u00e9l\u00e9guidage direct. Patriot : t\u00e9l\u00e9guidage indirect.","multi":false},{"q":"Un autodirecteur \u00ab EM passif \u00bb (r\u00e9cepteur radar) correspond typiquement \u00e0 un missile :","opts":[{"t":"Anti-radar","c":true},{"t":"Antichar filoguid\u00e9","c":false},{"t":"\u00c0 guidage GPS seul","c":false},{"t":"Non guid\u00e9","c":false}],"e":"Autoguidage : EM actif (E/R radar) ou laser ; EM passif = r\u00e9cepteur radar (missile anti-radar) ; IR en g\u00e9n\u00e9ral.","multi":false},{"q":"Le missile nucl\u00e9aire tactique fran\u00e7ais Pluton (jusqu'en 1993) a \u00e9t\u00e9 remplac\u00e9 par :","opts":[{"t":"Le missile Had\u00e8s (jusqu'en 1996)","c":true},{"t":"L'Exocet","c":false},{"t":"Le Mistral","c":false},{"t":"L'Aster 30","c":false}],"e":"Nucl\u00e9aire tactique : SS Pluton (rampe sur ch\u00e2ssis AMX-30) jusqu'en 1993, remplac\u00e9 par Had\u00e8s (camion semi-remorque, 2 missiles) jusqu'en 1996.","multi":false},{"q":"Quelle est la mission d'un missile A/A d'interception ?","opts":[{"t":"Intercepter des cibles volant en tr\u00e8s basse altitude (shoot-down) et en tr\u00e8s haute altitude, \u00e0 grande vitesse","c":true},{"t":"D\u00e9truire des blind\u00e9s au sol","c":false},{"t":"Couler des navires","c":false},{"t":"Brouiller les radars ennemis","c":false}],"e":"Interception : cibles TBA (shoot-down) et THA \u00e0 grande vitesse, distance de tir > 25 km, souvent \u00e9quip\u00e9 d'un autodirecteur \u00e9lectromagn\u00e9tique.","multi":false},{"q":"Quelle est la distance de tir typique d'un missile A/A d'interception ?","opts":[{"t":"Sup\u00e9rieure \u00e0 25 km","c":true},{"t":"Inf\u00e9rieure \u00e0 1 km","c":false},{"t":"Entre 1000 et 4000 m","c":false},{"t":"Sup\u00e9rieure \u00e0 400 km","c":false}],"e":"Interception : distance de tir sup\u00e9rieure \u00e0 25 km, capacit\u00e9 de tir avec d\u00e9nivel\u00e9 important (30000 ft).","multi":false},{"q":"Quelle est la mission principale d'un missile A/A de sup\u00e9riorit\u00e9 a\u00e9rienne ?","opts":[{"t":"L'interception \u00e0 courte port\u00e9e (autod\u00e9fense en mission secondaire)","c":true},{"t":"L'interception \u00e0 longue port\u00e9e (> 100 km)","c":false},{"t":"La destruction de navires","c":false},{"t":"Le brouillage radar","c":false}],"e":"Sup\u00e9riorit\u00e9 a\u00e9rienne : mission principale interception courte port\u00e9e, secondaire autod\u00e9fense ; tir tous secteurs sous 8g, 1000 \u00e0 4000 m, viseur de casque.","multi":false},{"q":"Parmi ces missiles, lesquels sont des missiles A/A de sup\u00e9riorit\u00e9 a\u00e9rienne (courte port\u00e9e) ?","opts":[{"t":"Le Magic 2 (FR)","c":true},{"t":"Le Sidewinder AIM9 (US)","c":true},{"t":"L'ASRAAM / le Mistral ATAM","c":true},{"t":"Le SCALP-EG","c":false}],"e":"Sup\u00e9riorit\u00e9 a\u00e9rienne : Magic 2, Sidewinder AIM9, ASRAAM, Mistral ATAM. Le SCALP-EG est un missile A/S \u00ab stand off \u00bb.","multi":true},{"q":"Le missile A/A longue port\u00e9e europ\u00e9en Meteor a une port\u00e9e de :","opts":[{"t":"P n par altitude d'engagement, que signifie \u00ab TBA \u00bb et quelle est sa limite ?","opts":[{"t":"Tr\u00e8s Basse Altitude, \u2264 500 ft","c":true},{"t":"Tr\u00e8s Haute Altitude, \u2265 50 000 ft","c":false},{"t":"Moyenne Altitude, \u2264 25 000 ft","c":false},{"t":"Basse Altitude, \u2264 5 000 ft","c":false}],"e":"Altitude : TBA \u2264 500 ft, BA \u2264 5000 ft, MA \u2264 25000 ft, HA \u2264 50000 ft, THA \u2265 50000 ft (1 ft = 0,3048 m).","multi":false},{"q":"Selon quels crit\u00e8res classe-t-on les syst\u00e8mes de d\u00e9fense anti-a\u00e9rienne S/A ?","opts":[{"t":"La port\u00e9e d'engagement","c":true},{"t":"L'altitude d'engagement","c":true},{"t":"La mobilit\u00e9 (fixe, semi-mobile, mobile, tr\u00e8s mobile)","c":true},{"t":"La couleur du radar","c":false}],"e":"Classification S/A : port\u00e9e d'engagement, altitude d'engagement et mobilit\u00e9 (fixe, semi-mobile, mobile, tr\u00e8s mobile).","multi":true},{"q":"Combien l'Arm\u00e9e de l'air et de l'Espace compte-t-elle d'escadrons sol-air de d\u00e9fense a\u00e9rienne (EDSA) et o\u00f9 sont-ils ?","opts":[{"t":"4 EDSA : St-Dizier, Avord, Mont-de-Marsan, Istres","c":true},{"t":"2 EDSA : Istres et Avord","c":false},{"t":"6 EDSA r\u00e9partis en Outre-Mer","c":false},{"t":"1 seul EDSA, \u00e0 Paris","c":false}],"e":"4 EDSA (St-Dizier, Avord, Mont-de-Marsan, Istres) prot\u00e8gent les sites de haute valeur et les forces d\u00e9ploy\u00e9es contre avions, h\u00e9licopt\u00e8res, drones et missiles.","multi":false},{"q":"Quels sont les deux syst\u00e8mes S/A mis en \u0153uvre par l'Arm\u00e9e de l'air et de l'Espace ?","opts":[{"t":"Le SAMP/T \u00ab MAMBA \u00bb (Aster 30)","c":true},{"t":"Le SACP Crotale NG","c":true},{"t":"Le syst\u00e8me russe S400","c":false},{"t":"Le Patriot am\u00e9ricain","c":false}],"e":"L'AAE met en \u0153uvre deux syst\u00e8mes : SAMP/T MAMBA (Aster 30) et SACP Crotale NG. Le S400 est russe, le Patriot est am\u00e9ricain.","multi":true},{"q":"Que peut faire le syst\u00e8me russe /* STATE & STORAGE */
var KEY = {theme:'cqo_theme',hist:'cqo_hist',acro:'cqo_acro',dates:'cqo_dates',set:'cqo_settings',qedits:'cqo_qedits',errs:'cqo_errs'};
var S = {tab:'cqo',quiz:null,matId:'__all__',nq:20,
         revMat:'__all__',revIdx:0,errMat:'__all__',errAll:false,revFlipped:false,msg:null,editIdx:-1,editMat:''};

function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function getHist(){try{return JSON.parse(ls(KEY.hist)||'[]')}catch(e){return[]}}
function addHist(r){var h=getHist();h.unshift(r);if(h.length>200)h=h.slice(0,200);lsSet(KEY.hist,JSON.stringify(h));}
function getAcro(){try{var v=ls(KEY.acro);if(!v){lsSet(KEY.acro,JSON.stringify(DEFAULT_ACROS));return DEFAULT_ACROS.slice();}return JSON.parse(v);}catch(e){return DEFAULT_ACROS.slice();}}
function getDates(){try{return JSON.parse(ls(KEY.dates)||'[]')}catch(e){return[]}}
function setAcro(a){lsSet(KEY.acro,JSON.stringify(a));}
function setDates(a){lsSet(KEY.dates,JSON.stringify(a));}
function getSet(){var s={};try{s=JSON.parse(ls(KEY.set)||'{}')||{};}catch(e){}return{timer:!!s.timer,seuil:s.seuil||50,ankiMin:s.ankiMin===undefined?40:s.ankiMin};}
function setOpt(k,v){var s=getSet();s[k]=v;lsSet(KEY.set,JSON.stringify(s));render();}
function setTimerOpt(v){var s=getSet();s.timer=v;lsSet(KEY.set,JSON.stringify(s));render();}
function timerBtns(){var on=getSet().timer;
  return '<button class="nq-btn'+(!on?' active':'')+'" onclick="setTimerOpt(false)">Sans chrono</button>'
    +'<button class="nq-btn'+(on?' active':'')+'" onclick="setTimerOpt(true)">&#9201; 1 min / question</button>';}
function getEdits(){try{return JSON.parse(ls(KEY.qedits)||'{}')}catch(e){return{}}}
function saveMatEdits(mat){var e=getEdits();e[mat]={name:MATIERES[mat].name,qs:MATIERES[mat].qs};lsSet(KEY.qedits,JSON.stringify(e));}
(function applyEdits(){var e=getEdits();Object.keys(e).forEach(function(k){if(e[k]&&e[k].qs)MATIERES[k]={name:e[k].name||k,qs:e[k].qs};});})();
(function tagMat(){Object.keys(MATIERES).forEach(function(k){MATIERES[k].qs.forEach(function(q){q._m=k;});});})();
function qKey(q){return (q._m||'')+'|'+q.q;}
function getErrs(){try{return JSON.parse(ls(KEY.errs)||'{}')}catch(e){return{}}}
function setErrs(e){lsSet(KEY.errs,JSON.stringify(e));}
function recordAnswer(q,correct){
  var e=getErrs();var k=qKey(q);
  if(!correct){var r=e[k]||{n:0};r.n++;r.last=Date.now();r.ok=false;e[k]=r;setErrs(e);}
  else if(e[k]&&!e[k].ok){e[k].ok=true;e[k].fixed=Date.now();setErrs(e);}
}
function findQ(k){
  var i=k.indexOf('|'),mk=k.slice(0,i),t=k.slice(i+1),m=MATIERES[mk],j;
  if(m)for(j=0;j<m.qs.length;j++)if(m.qs[j].q===t)return m.qs[j];
  for(var id in TESTS){var a=TESTS[id].qs;for(j=0;j<a.length;j++)if(a[j]._m===mk&&a[j].q===t)return a[j];}
  return null;
}
function errMatOf(k){return k.slice(0,k.indexOf('|'));}
function errKeys(){
  var e=getErrs();
  return Object.keys(e).filter(function(k){
    return findQ(k)&&(S.errAll||!e[k].ok)&&(S.errMat==='__all__'||errMatOf(k)===S.errMat);
  });
}
function updateErrTab(){var ne=errTodoCount();el('tabErr').textContent='Mes erreurs'+(ne?' ('+ne+')':'');}
function errTodoCount(){var e=getErrs();return Object.keys(e).filter(function(k){return !e[k].ok&&findQ(k);}).length;}
function matLabel(id){if(String(id).indexOf('__test_')===0){var tt=TESTS[id.slice(7)];return tt?'Test '+tt.short:id;}return id==='__all__'?'Toutes les matières':id==='__errors__'?'Mes erreurs':(MATIERES[id]||{name:id}).name;}
function isMulti(q){return !!q.multi||q.opts.filter(function(o){return o.c;}).length>1;}
function totalQ(){return Object.values(MATIERES).reduce(function(s,m){return s+m.qs.length;},0);}

function getQuestions(matId){
  if(matId==='__errors__')return errKeys().map(findQ);
  if(matId==='__all__'){
    var all=[];Object.values(MATIERES).forEach(function(m){all=all.concat(m.qs);});return all;
  }
  return(MATIERES[matId]||{qs:[]}).qs;
}
function shuffle(arr){
  var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;
}
function el(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function letters(i){return 'ABCDE'[i]||'';}

/* RENDER */
function render(){
  document.querySelectorAll('.topnav button').forEach(function(b){
    b.setAttribute('aria-selected',b.dataset.tab===S.tab?'true':'false');
  });
  updateErrTab();
  if(S.exam&&!S.exam.done){renderExam();}
  else if(S.quiz&&!S.quiz.done){renderQuizActive();}
  else if(S.tab==='cqo'){renderCQO();}
  else if(S.tab==='revisions'){renderRevisions();}
  else if(S.tab==='acronymes'){renderAcronymes();}
  else if(S.tab==='dates'){renderDates();}
  else if(S.tab==='histoire'){renderHistoire();}
  else if(S.tab==='reglages'){renderReglages();}
  else if(S.tab==='erreurs'){renderErreurs();}
  else if(S.tab==='tests'){renderTests();}
}

/* TAB: CQO */
function renderCQO(){
  if(S.quiz&&S.quiz.done){renderResult();return;}
  if(S.matId==='__errors__')S.matId='__all__';
  var totalAll=Object.values(MATIERES).reduce(function(s,m){return s+m.qs.length;},0);
  var matCards=Object.entries(MATIERES).map(function(e){
    var k=e[0];var m=e[1];var sel=S.matId===k;
    return '<div class="mat-card'+(sel?' selected':'')+'" data-mat="'+esc(k)+'" onclick="selMat(this)">'
      +'<div class="mat-name">'+esc(m.name)+'</div>'
      +'<div class="mat-count">'+m.qs.length+' question'+(m.qs.length>1?'s':'')+'</div>'
      +'</div>';
  }).join('');
  var allSel=S.matId==='__all__';
  var nqOpts=[10,20,40,100,'Tout'].map(function(n){
    var v=n==='Tout'?99999:n;
    return '<button class="nq-btn'+(S.nq===v?' active':'')+'" onclick="selNq('+v+')">'+n+'</button>';
  }).join('');
  var avail=getQuestions(S.matId).length;
  var nqFinal=Math.min(S.nq,avail);
  el('app').innerHTML=
    '<div class="card">'
    +'<div class="eyebrow">Entraînement CQO</div>'
    +'<h2 style="font-size:1.3rem;margin-bottom:6px">Préparez-vous au QCM</h2>'
    +'<p class="muted">'+totalAll+' questions sur '+Object.keys(MATIERES).length+' matières</p>'
    +'</div>'
    +'<div class="card" style="margin-top:12px">'
    +'<div class="eyebrow">Matière</div>'
    +'<div style="margin-bottom:8px"><button class="btn btn-secondary btn-sm" style="'+(allSel?'border-color:var(--gold);color:var(--gold)':'')+'" onclick="selMat(null)">Toutes les matières ('+totalAll+')</button></div>'
    +'<div class="mat-grid">'+matCards+'</div>'
    +'</div>'
    +'<div class="card" style="margin-top:12px">'
    +'<div class="eyebrow">Nombre de questions</div>'
    +'<div class="nq-row">'+nqOpts+'</div>'
    +(avail<S.nq?'<p class="muted small">'+avail+' questions disponibles → '+nqFinal+' seront sélectionnées</p>':'')
    +'<div class="eyebrow" style="margin-top:14px">Chronomètre</div>'
    +'<div class="nq-row">'+timerBtns()+'</div>'
    +'</div>'
    +'<div style="margin-top:16px;text-align:center">'
    +'<button class="btn btn-primary" style="font-size:1rem;padding:14px 36px" onclick="startQuiz()">Commencer ('+nqFinal+' q)</button>'
    +'</div>';
}

function selMat(e){S.matId=e?e.dataset.mat:'__all__';renderCQO();}
function selNq(n){S.nq=n;renderCQO();}

/* QUIZ */
var TMR=null;var TMR_DUR=60;
function stopTimer(){if(TMR){clearInterval(TMR);TMR=null;}}
function startTimer(){
  var end=Date.now()+TMR_DUR*1000;
  function tick(){
    var t=el('tmr'),b=el('tmrBar');
    if(!t||!S.quiz||S.quiz.locked){stopTimer();return;}
    var left=Math.max(0,end-Date.now());var s=Math.ceil(left/1000);
    t.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);
    t.classList.toggle('low',s<=10);b.classList.toggle('low',s<=10);
    b.style.width=(left/(TMR_DUR*1000)*100)+'%';
    if(left<=0){stopTimer();validate(true);}
  }
  tick();TMR=setInterval(tick,250);
}

function startQuiz(){
  var pool=shuffle(getQuestions(S.matId));var n=Math.min(S.nq,pool.length);
  if(n<1){alert(S.matId==='__errors__'?'Bravo : plus aucune erreur à revoir dans cette sélection.':'Aucune question disponible pour cette sélection.');render();return;}
  var qs=pool.slice(0,n).map(function(q){return Object.assign({},q,{opts:shuffle(q.opts)});});
  S.quiz={qs:qs,idx:0,score:0,start:Date.now(),answers:[],done:false,matId:S.matId,timer:getSet().timer};
  renderQuizActive();
}

function renderQuizActive(){
  stopTimer();
  var q=S.quiz.qs[S.quiz.idx];var total=S.quiz.qs.length;var multi=isMulti(q);
  var pct=((S.quiz.idx)/total*100).toFixed(0);
  S.quiz.sel=[];S.quiz.locked=false;
  var opts=q.opts.map(function(o,i){
    return '<button class="opt-btn" data-idx="'+i+'" onclick="pick('+i+')">'
      +'<span class="opt-letter">'+letters(i)+'</span>'+esc(o.t)+'</button>';
  }).join('');
  el('app').innerHTML=
    '<div class="card" id="qcard">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">'
    +'<span class="muted small">Question '+(S.quiz.idx+1)+'/'+total+'</span>'
    +(S.quiz.timer?'<span class="badge timer-badge" id="tmr">1:00</span>':'')
    +'<span class="badge badge-gold">'+S.quiz.score+'/'+S.quiz.idx+'</span>'
    +'</div>'
    +'<div class="prog-wrap"><div class="prog-bar" style="width:'+pct+'%"></div></div>'
    +(S.quiz.timer?'<div class="tmr-wrap"><div class="tmr-bar" id="tmrBar"></div></div>':'')
    +(multi?'<p class="multi-hint">Plusieurs réponses possibles — sélectionnez puis validez</p>':'')
    +'<p style="font-size:1.05rem;font-weight:600;line-height:1.5;margin-bottom:16px">'+esc(q.q)+'</p>'
    +'<div>'+opts+'</div>'
    +(multi?'<button class="btn btn-primary btn-block" id="validBtn" onclick="validate()" disabled>Valider</button>':'')
    +'</div>'
    +'<div style="text-align:center;margin-top:12px"><button class="quit-link" onclick="goHome()">Quitter le QCM</button></div>';
  if(S.quiz.timer)startTimer();
}

function pick(i){
  var q=S.quiz.qs[S.quiz.idx];if(S.quiz.locked)return;
  if(!isMulti(q)){S.quiz.sel=[i];validate();return;}
  var k=S.quiz.sel.indexOf(i);
  if(k<0)S.quiz.sel.push(i);else S.quiz.sel.splice(k,1);
  document.querySelectorAll('.opt-btn').forEach(function(b,j){b.classList.toggle('selected',S.quiz.sel.indexOf(j)>=0);});
  el('validBtn').disabled=!S.quiz.sel.length;
}

function validate(timeout){
  if(!S.quiz||S.quiz.locked)return;
  S.quiz.locked=true;stopTimer();
  var q=S.quiz.qs[S.quiz.idx];var multi=isMulti(q);
  var sel=timeout?[]:S.quiz.sel.slice();
  var correct=!timeout&&q.opts.every(function(o,i){return !!o.c===(sel.indexOf(i)>=0);});
  document.querySelectorAll('.opt-btn').forEach(function(b,i){
    b.disabled=true;b.classList.remove('selected');
    var chosen=sel.indexOf(i)>=0;
    if(q.opts[i].c)b.classList.add(chosen||!multi?'correct':'missed');
    else if(chosen)b.classList.add('wrong');
  });
  if(correct)S.quiz.score++;
  S.quiz.answers.push({chosen:sel,correct:correct,timeout:!!timeout});
  recordAnswer(q,correct);updateErrTab();
  var card=el('qcard');var vb=el('validBtn');if(vb)vb.remove();
  var v=document.createElement('div');v.className='verdict '+(correct?'ok':'ko');
  v.textContent=timeout?'⏱ Temps écoulé':correct?'✓ Bonne réponse':multi?'✗ Réponse incomplète ou incorrecte':'✗ Mauvaise réponse';
  card.appendChild(v);
  if(q.e){var div=document.createElement('div');div.className='expl';div.textContent=q.e;card.appendChild(div);}
  var nextBtn=document.createElement('button');
  nextBtn.className='btn btn-primary btn-block';
  nextBtn.textContent=S.quiz.idx+1<S.quiz.qs.length?'Question suivante →':'Voir les résultats';
  nextBtn.onclick=nextQ;
  card.appendChild(nextBtn);
}

function nextQ(){
  stopTimer();
  S.quiz.idx++;
  if(S.quiz.idx>=S.quiz.qs.length){
    S.quiz.done=true;
    addHist({date:Date.now(),mat:S.quiz.matId,score:S.quiz.score,total:S.quiz.qs.length,ms:Date.now()-S.quiz.start});
    renderResult();
  }else{renderQuizActive();}
  window.scrollTo(0,0);
}

function goHome(){
  if(S.quiz&&!S.quiz.done&&!confirm('Quitter le QCM en cours ? La progression sera perdue.'))return;
  if(S.exam&&!S.exam.done&&!confirm('Abandonner le test en cours ? Il ne sera pas enregistré.'))return;
  stopTimer();stopExamTimer();S.quiz=null;S.exam=null;S.tab='cqo';render();window.scrollTo(0,0);
}

function renderResult(){
  var q=S.quiz;var pct=Math.round(q.score/q.qs.length*100);
  var stars=pct>=85?'★★★':pct>=60?'★★☆':'★☆☆';
  var secs=Math.round((Date.now()-q.start)/1000);
  var mins=Math.floor(secs/60);var sec2=secs%60;
  var matName=matLabel(q.matId);
  var wrong=[];
  q.qs.forEach(function(quest,i){
    var a=q.answers[i];if(a&&!a.correct)wrong.push({q:quest,a:a});
  });
  var wrongHTML=wrong.length?'<div class="card" style="margin-top:12px"><div class="eyebrow">Erreurs ('+wrong.length+')</div>'
    +wrong.map(function(w,i){
      var rightAns=w.q.opts.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(' / ');
      var given=w.a.timeout?'Temps écoulé':w.a.chosen.length?w.a.chosen.map(function(j){return w.q.opts[j].t;}).join(' / '):'Aucune réponse';
      return '<div class="qa-item"><div class="qa-num">'+(i+1)+'</div><div class="qa-text">'
        +'<div style="margin-bottom:4px">'+esc(w.q.q)+'</div>'
        +'<div style="color:var(--bad);font-size:.82rem">✗ '+esc(given)+'</div>'
        +'<div style="color:var(--good);font-size:.82rem">✓ '+esc(rightAns)+'</div>'
        +(w.q.e?'<div class="expl" style="margin-top:6px">'+esc(w.q.e)+'</div>':'')
        +'</div></div>';
    }).join('')+'</div>':'';
  el('app').innerHTML=
    '<div class="card">'
    +'<div class="eyebrow">Résultat</div>'
    +'<div class="score-ring">'
    +'<div class="ring"><svg width="88" height="88"><circle cx="44" cy="44" r="36" fill="none" stroke="var(--line)" stroke-width="8"/>'
    +'<circle cx="44" cy="44" r="36" fill="none" stroke="'+(pct>=60?'var(--good)':'var(--bad)')+'" stroke-width="8"'
    +' stroke-dasharray="'+Math.round(2*3.14159*36)+'" stroke-dashoffset="'+Math.round(2*3.14159*36*(1-pct/100))+'" stroke-linecap="round"/>'
    +'</svg><div class="ring-label"><div class="ring-pct">'+pct+'%</div><div class="ring-sub">'+stars+'</div></div></div>'
    +'<div><div style="font-size:1.5rem;font-weight:800">'+q.score+' / '+q.qs.length+'</div>'
    +'<div class="muted">'+esc(matName)+'</div>'
    +'<div class="muted">'+mins+'min '+sec2+'s'+(q.timer?' · chrono 1 min/q':'')+'</div></div>'
    +'</div>'
    +'<div style="display:flex;gap:10px;margin-top:4px;flex-wrap:wrap">'
    +'<button class="btn btn-primary" onclick="restartSame()">Recommencer</button>'
    +(q.matId==='__errors__'
      ?'<button class="btn btn-secondary" onclick="S.quiz=null;S.tab=\'erreurs\';render()">Retour à mes erreurs</button>'
      :'<button class="btn btn-secondary" onclick="S.quiz=null;S.tab=\'cqo\';render()">Choisir un autre QCM</button>'
       +(wrong.length?'<button class="btn btn-secondary" onclick="S.quiz=null;S.tab=\'erreurs\';render()">Voir mes erreurs</button>':''))
    +'</div></div>'
    +wrongHTML;
}

function restartSame(){var old=S.quiz;S.quiz=null;S.matId=old.matId;S.nq=old.qs.length;startQuiz();}

/* TESTS (mode examen) */
var EXT=null;
function stopExamTimer(){if(EXT){clearInterval(EXT);EXT=null;}}
function lastTest(id){return getHist().filter(function(x){return x.mat==='__test_'+id;})[0];}
function renderTests(){
  if(S.exam&&S.exam.done){renderExamResult();return;}
  var st=getSet();
  var cards=Object.keys(TESTS).map(function(id){
    var t=TESTS[id],last=lastTest(id);
    var n=t.mode==='random'?Math.min(t.n,t.qs.length):t.qs.length;
    var mins=t.chrono?st.ankiMin:0;
    return '<div class="card" style="margin-top:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
      +'<div><div class="eyebrow">Test blanc</div><h2 style="font-size:1.2rem;margin-bottom:4px">'+esc(t.name)+'</h2></div>'
      +'<span class="lvl '+(t.level==='Facile'?'lvl-easy':'lvl-hard')+'">'+esc(t.level)+'</span></div>'
      +'<ul class="test-facts">'
      +'<li>'+n+' questions '+(t.mode==='random'?'tirées au hasard parmi '+t.qs.length:'dans un ordre aléatoire')+'</li>'
      +(t.shuffleOpts?'<li>Propositions mélangées</li>':'')
      +'<li>'+(mins?'Chrono global : '+mins+' min':'Sans chrono')+'</li>'
      +'<li>Correction à la fin · réussite à '+st.seuil+' %</li></ul>'
      +(last?'<p class="muted small">Dernier passage : '+last.score+'/'+last.total+' ('+Math.round(last.score/last.total*100)+' %) le '
        +new Date(last.date).toLocaleDateString('fr-FR')+'</p>':'')
      +'<button class="btn btn-primary btn-block" onclick="startExam(\''+id+'\')">Lancer le test</button>'
      +'</div>';
  }).join('');
  var seuils=[50,60,70,80].map(function(v){
    return '<button class="nq-btn'+(st.seuil===v?' active':'')+'" onclick="setOpt(\'seuil\','+v+')">'+v+' %</button>';}).join('');
  var chronos=[0,20,30,40,60].map(function(v){
    return '<button class="nq-btn'+(st.ankiMin===v?' active':'')+'" onclick="setOpt(\'ankiMin\','+v+')">'+(v?v+' min':'Sans')+'</button>';}).join('');
  el('app').innerHTML=
    '<div class="card"><div class="eyebrow">Tests</div>'
    +'<h2 style="font-size:1.3rem;margin-bottom:6px">Tests blancs en conditions d’examen</h2>'
    +'<p class="muted">Aucune correction pendant le test : vous pouvez naviguer entre les questions et modifier vos réponses, puis la correction complète s’affiche à la fin. Les erreurs alimentent « Mes erreurs » et le score est enregistré dans l’Historique.</p></div>'
    +cards
    +'<div class="card" style="margin-top:12px"><div class="eyebrow">Réglages des tests</div>'
    +'<label class="lbl">Seuil de réussite</label><div class="nq-row">'+seuils+'</div>'
    +'<label class="lbl">Chrono du test Anki (difficile)</label><div class="nq-row">'+chronos+'</div></div>';
}
function startExam(id){
  var t=TESTS[id];var pool=shuffle(t.qs);if(t.mode==='random')pool=pool.slice(0,t.n);
  var qs=pool.map(function(q){return Object.assign({},q,{opts:t.shuffleOpts?shuffle(q.opts):q.opts.slice()});});
  var st=getSet();var mins=t.chrono?st.ankiMin:0;
  stopExamTimer();S.quiz=null;S.tab='tests';S.examFilter='all';
  S.exam={id:id,qs:qs,idx:0,sel:qs.map(function(){return[];}),start:Date.now(),
          deadline:mins?Date.now()+mins*60000:0,done:false,seuil:st.seuil};
  render();window.scrollTo(0,0);
}
function examTick(){
  var X=S.exam;if(!X||X.done||!X.deadline){stopExamTimer();return;}
  var left=Math.max(0,X.deadline-Date.now()),s=Math.ceil(left/1000),b=el('exTmr');
  if(b){b.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);b.classList.toggle('low',s<=60);}
  if(left<=0){stopExamTimer();finishExam(true);}
}
function renderExam(){
  var X=S.exam,t=TESTS[X.id],q=X.qs[X.idx],N=X.qs.length,multi=isMulti(q);
  var answered=X.sel.filter(function(a){return a.length;}).length;
  var opts=q.opts.map(function(o,i){
    return '<button class="opt-btn'+(X.sel[X.idx].indexOf(i)>=0?' selected':'')+'" onclick="examPick('+i+')">'
      +'<span class="opt-letter">'+letters(i)+'</span>'+esc(o.t)+'</button>';
  }).join('');
  var grid=X.qs.map(function(_,i){
    return '<button class="exam-cell'+(X.sel[i].length?' done':'')+(i===X.idx?' cur':'')+'" onclick="examGo('+i+')">'+(i+1)+'</button>';
  }).join('');
  el('app').innerHTML=
    '<div class="card">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">'
    +'<span class="eyebrow" style="margin:0">'+esc(t.name)+'</span>'
    +(X.deadline?'<span class="badge timer-badge" id="exTmr">--:--</span>':'')
    +'<span class="muted small">'+answered+'/'+N+' répondues</span></div>'
    +'<div class="prog-wrap"><div class="prog-bar" style="width:'+(answered/N*100)+'%"></div></div>'
    +'<p class="muted small">Question '+(X.idx+1)+' / '+N+'</p>'
    +(multi?'<p class="multi-hint">Plusieurs réponses possibles</p>':'')
    +'<p style="font-size:1.05rem;font-weight:600;line-height:1.5;margin:6px 0 16px">'+esc(q.q)+'</p>'
    +'<div>'+opts+'</div>'
    +'<div style="display:flex;gap:10px;margin-top:8px">'
    +'<button class="btn btn-secondary" style="flex:1" onclick="examGo('+(X.idx-1)+')"'+(X.idx?'':' disabled')+'>← Précédente</button>'
    +(X.idx<N-1
      ?'<button class="btn btn-primary" style="flex:1" onclick="examGo('+(X.idx+1)+')">Suivante →</button>'
      :'<button class="btn btn-primary" style="flex:1" onclick="finishExam()">Terminer le test</button>')
    +'</div></div>'
    +'<div class="card" style="margin-top:12px"><div class="eyebrow">Navigation</div>'
    +'<div class="exam-grid">'+grid+'</div>'
    +'<button class="btn btn-secondary btn-block" onclick="finishExam()">Terminer et voir la correction</button></div>'
    +'<div style="text-align:center;margin-top:12px"><button class="quit-link" onclick="goHome()">Abandonner le test</button></div>';
  if(X.deadline){examTick();if(!EXT)EXT=setInterval(examTick,500);}
}
function examPick(i){
  var X=S.exam,q=X.qs[X.idx],a=X.sel[X.idx];
  if(isMulti(q)){var k=a.indexOf(i);if(k<0)a.push(i);else a.splice(k,1);}
  else X.sel[X.idx]=(a[0]===i)?[]:[i];
  renderExam();
}
function examGo(i){if(i<0||i>=S.exam.qs.length)return;S.exam.idx=i;renderExam();window.scrollTo(0,0);}
function finishExam(timeout){
  var X=S.exam;if(!X||X.done)return;
  if(!timeout){
    var un=X.sel.filter(function(a){return !a.length;}).length;
    if(!confirm(un?'Il reste '+un+' question'+(un>1?'s':'')+' sans réponse. Terminer quand même ?':'Terminer le test et voir la correction ?'))return;
  }
  stopExamTimer();X.done=true;X.timeout=!!timeout;X.end=Date.now();
  X.res=X.qs.map(function(q,i){var s=X.sel[i];return q.opts.every(function(o,j){return !!o.c===(s.indexOf(j)>=0);});});
  X.score=X.res.filter(Boolean).length;
  X.qs.forEach(function(q,i){recordAnswer(q,X.res[i]);});
  addHist({date:Date.now(),mat:'__test_'+X.id,score:X.score,total:X.qs.length,ms:X.end-X.start});
  S.tab='tests';S.examFilter='all';render();window.scrollTo(0,0);
  if(timeout)alert('Temps écoulé : le test a été terminé automatiquement.');
}
function renderExamResult(){
  var X=S.exam,t=TESTS[X.id],N=X.qs.length,pct=Math.round(X.score/N*100),pass=pct>=X.seuil;
  var secs=Math.round((X.end-X.start)/1000),C=Math.round(2*3.14159*36);
  var items=X.qs.map(function(q,i){
    if(S.examFilter==='ko'&&X.res[i])return '';

      +'<div class="qa-text"><div style="font-weight:600;margin-bottom:4px">'+esc(q.q)+'</div>'
      +(X.res[i]?'':'<div style="color:var(--bad);font-size:.84rem">Votre réponse : '+esc(given)+'</div>')
      +'<div style="color:var(--good);font-size:.84rem">✓ '+esc(good)+'</div>'
      +(q.e?'<div class="expl" style="margin-top:6px">'+esc(q.e)+'</div>':'')
      +'<div class="muted small" style="margin-top:4px">'+esc(matLabel(q._m))+'</div>'
      +'</div></div>';
  }).join('');
